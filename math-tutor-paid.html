<div class="hero"><h1>📐 Math Tutor</h1><p>Mathematics for Social Science · University Freshman Course</p>
<div class="stat"><div><b id="s1">–</b>Basic best</div><div><b id="s2">–</b>Hard best</div><div><b id="s3">–</b>Exam best</div></div></div>

<script>
var CH=[["🧠","Logic & Sets"],["🔢","Numbers & Inequalities"],["📈","Functions"],["⚖️","Linear Prog."],["🧮","Matrices"],["➕","Sequences & Interest"],["📊","Statistics"],["∂","Calculus"]];
var N={};
N[1]='<div class="card"><h2>1. Statements and connectives</h2><p>A <b>statement</b> is a sentence that is true or false, never both. “Addis Ababa is in Ethiopia” is a statement; “Close the door” is not.</p><p><span class="f">¬p</span> not · <span class="f">p∧q</span> and · <span class="f">p∨q</span> or · <span class="f">p→q</span> if…then · <span class="f">p↔q</span> if and only if</p></div>'+
'<div class="card"><h2>2. Truth table</h2><div class="tw"><table><tr><th>p</th><th>q</th><th>p∧q</th><th>p∨q</th><th>p→q</th><th>p↔q</th></tr><tr><td>T</td><td>T</td><td>T</td><td>T</td><td>T</td><td>T</td></tr><tr><td>T</td><td>F</td><td>F</td><td>T</td><td>F</td><td>F</td></tr><tr><td>F</td><td>T</td><td>F</td><td>T</td><td>T</td><td>F</td></tr><tr><td>F</td><td>F</td><td>F</td><td>F</td><td>T</td><td>T</td></tr></table></div><div class="tip">AND is true only if both are true. OR is false only if both are false. IF…THEN is false only for T → F. With n statements the table has 2ⁿ rows.</div></div>'+
'<div class="card"><h2>3. Key equivalences</h2><p><span class="f">p→q ≡ ¬p∨q</span></p><p><span class="f">¬(p→q) ≡ p∧¬q</span></p><p>De Morgan: <span class="f">¬(p∧q) ≡ ¬p∨¬q</span>, <span class="f">¬(p∨q) ≡ ¬p∧¬q</span></p><p>For p→q: converse q→p, inverse ¬p→¬q, <b>contrapositive ¬q→¬p</b> (always equivalent to the original).</p><p><b>Tautology:</b> always true (p∨¬p). <b>Contradiction:</b> always false (p∧¬p).</p><p><b>Quantifiers:</b> negate “All are…” → “Some are not…”. Negate “Some are…” → “None are…”.</p></div>'+
'<div class="card"><h2>4. Sets</h2><p>Roster: A={1,2,3}. Rule: A={x | x∈ℕ, x&lt;4}.</p><p><span class="f">∈</span> element · <span class="f">⊆</span> subset · <span class="f">∅</span> empty set · <span class="f">U</span> universal · <span class="f">A′</span> complement</p><p>A∪B all in either · A∩B in both · A−B in A not B.</p><p>n elements → <b>2ⁿ subsets</b>, 2ⁿ−1 proper subsets. ∅ is a subset of every set; {∅} has 1 element.</p><p>De Morgan: <span class="f">(A∪B)′=A′∩B′</span>, <span class="f">(A∩B)′=A′∪B′</span></p></div>'+
'<div class="card"><h2>5. Counting (Venn)</h2><p><span class="f">n(A∪B)=n(A)+n(B)−n(A∩B)</span></p><p><span class="f">n(A∪B∪C)=ΣA − Σ(pairs) + n(A∩B∩C)</span></p><div class="tip">Always fill the centre first, then subtract it from the overlaps, then the circles. Check that the total plus “neither” equals the universe.</div><p><b>Example:</b> 60 students, 35 Math, 30 Econ, 10 both. At least one = 35+30−10 = 55; neither = 5.</p></div>';
N[2]='<div class="card"><h2>Number systems</h2><p>ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. Irrationals (√2, π) are in ℝ but not ℚ.</p><h2>Inequalities</h2><p>Multiplying or dividing by a <b>negative</b> flips the sign.</p><p><span class="f">|x|&lt;a ⇔ −a&lt;x&lt;a</span> · <span class="f">|x|&gt;a ⇔ x&lt;−a or x&gt;a</span></p><p>Quadratic: <span class="f">x=(−b±√(b²−4ac))/2a</span>. Find roots, draw a sign line, test each interval.</p></div>';
N[3]='<div class="card"><h2>Functions</h2><p>Domain = allowed inputs, range = outputs. Fractions: denominator ≠ 0. Roots: inside ≥ 0. Logs: inside &gt; 0.</p><p>Line: <span class="f">y=mx+b</span>. Parabola vertex at <span class="f">x=−b/2a</span>.</p><p>Logs: <span class="f">log(ab)=log a+log b</span>, <span class="f">log(a/b)=log a−log b</span>, <span class="f">log aⁿ=n·log a</span>.</p><p>Business: break-even when revenue = cost; equilibrium when supply = demand.</p></div>';
N[4]='<div class="card"><h2>Linear programming</h2><p>1) Define variables. 2) Write the objective (max profit or min cost). 3) Write constraints. 4) Graph and shade the feasible region. 5) Evaluate the objective at <b>every corner point</b>. 6) Pick the best.</p><div class="tip">Do not forget x≥0 and y≥0.</div></div>';
N[5]='<div class="card"><h2>Matrices</h2><p>AB exists only if columns of A = rows of B. Matrix multiplication is not commutative.</p><p>2×2: <span class="f">det = ad−bc</span>, inverse <span class="f">(1/det)·[d −b; −c a]</span>.</p><p>Cramer: <span class="f">x=Dₓ/D, y=D_y/D</span>, valid when D≠0.</p></div>';
N[6]='<div class="card"><h2>Sequences and interest</h2><p>Arithmetic: <span class="f">aₙ=a+(n−1)d</span>, <span class="f">Sₙ=n/2·(2a+(n−1)d)</span>.</p><p>Geometric: <span class="f">aₙ=a·rⁿ⁻¹</span>, <span class="f">Sₙ=a(1−rⁿ)/(1−r)</span>, infinite sum <span class="f">a/(1−r)</span> if |r|&lt;1.</p><p>Simple interest <span class="f">I=Prt</span>. Compound <span class="f">A=P(1+r/m)^(mt)</span>.</p></div>';
N[7]='<div class="card"><h2>Statistics</h2><p>Mean = sum ÷ n. Median = middle value (sorted). Mode = most frequent.</p><p>Variance <span class="f">s²=Σ(x−x̄)²/(n−1)</span>; standard deviation is its square root. Range = max − min.</p></div>';
N[8]='<div class="card"><h2>Calculus</h2><p>Power rule <span class="f">d/dx xⁿ = n·xⁿ⁻¹</span>; product and chain rules for combined functions.</p><p>Marginal cost = C′(x), marginal revenue = R′(x). <b>Profit is maximised when MR = MC</b> (and the second derivative is negative).</p></div>';
function X(n,h){N[n]+='<div class="card"><h2>Worked examples &amp; exam traps</h2>'+h+'</div>'}
X(2,'<p><b>1)</b> 2x−5&lt;3x+1 → −6&lt;x, so x&gt;−6.</p><p><b>2)</b> |2x−1|≤5 → −5≤2x−1≤5 → −2≤x≤3.</p><p><b>3)</b> x²−x−6&gt;0 → (x−3)(x+2)&gt;0 → x&lt;−2 or x&gt;3.</p><p>Discriminant D=b²−4ac: D&gt;0 two real roots, D=0 one, D&lt;0 none. Intervals: (a,b) open, [a,b] closed.</p><div class="tip">Trap: never multiply or divide by a negative without flipping the sign, and never cancel a variable factor without checking its sign.</div>');
X(3,'<p><b>Domain</b> of √(x−4)/(x−6): x≥4 and x≠6.</p><p>f(x)=2x²−8x+3: vertex at x=2, minimum f(2)=−5.</p><p>Cost C=F+vx, revenue R=px. Break-even x=F/(p−v).</p><p>Composite (f∘g)(x)=f(g(x)). Inverse: swap x and y, then solve for y. Equilibrium: set demand = supply.</p><div class="tip">Trap: f(g(x)) is not g(f(x)).</div>');
X(4,'<p><b>Example:</b> Max P=3x+2y, x+y≤4, x≤3, x,y≥0. Corners (0,0),(3,0),(3,1),(0,4) give P=0,9,11,8. Maximum 11 at (3,1).</p><p>Limited resources use ≤. Minimum requirements use ≥.</p><div class="tip">Traps: forgetting x,y≥0; testing only some corners; a region with no corners can be unbounded; if the objective is parallel to an edge, many points tie.</div>');
X(5,'<p>A=[2 1; 5 3]: det=6−5=1, A⁻¹=[3 −1; −5 2].</p><p>Cramer: 2x+y=5, x−y=1 → D=−3, Dx=−6, Dy=−3, so x=2, y=1.</p><p>(AB)ᵀ=BᵀAᵀ. det=0 means singular: no inverse and Cramer fails.</p><div class="tip">Trap: AB≠BA in general. Check sizes first: (m×n)(n×p) gives m×p.</div>');
X(6,'<p>AP 3,7,11…: a₂₀=3+19·4=79, S₂₀=20/2·(6+76)=820.</p><p>GP 2,6,18…: S₅=2(3⁵−1)/(3−1)=242.</p><p>10,000 birr at 12% for 3 years: simple = 3,600 interest; compound = 10,000×1.12³ = 14,049.28.</p><div class="tip">Traps: use n−1 in the term formula; the infinite sum exists only when |r|&lt;1; match the rate to the period (monthly vs yearly).</div>');
X(7,'<p>Data 2,4,4,6,9: mean 5, median 4, mode 4. Squared deviations sum to 28, so sample variance 28/4=7, SD≈2.65. Population variance 28/5=5.6.</p><p>Range = max − min. IQR = Q3 − Q1. Grouped data: use class midpoints.</p><div class="tip">Trap: check whether your lecturer uses n or n−1. The mean is pulled by outliers; the median is not.</div>');
X(8,'<p>lim x→2 (x²−4)/(x−2)=lim (x+2)=4.</p><p>C=x²+10x+100 → MC=2x+10. R=50x−x² → MR=50−2x. MR=MC gives x=10.</p><p>P=40x−2x²−100, P′=40−4x=0, P″=−4&lt;0, so maximum. P(10)=100.</p><div class="tip">Trap: always confirm a maximum with the second derivative, and plug back to find the value.</div>');
var QQ={2:[["Solve 3x−7 ≥ 2x+5",["x≥12","x≤12","x≥−2","x≤−2"],0,"3x−2x ≥ 5+7, so x ≥ 12.",0,"No negative multiplication, so the sign stays."],["|x−3|<4 gives:",["(−1,7)","(−7,1)","(−∞,−1)∪(7,∞)","(1,7)"],0,"−4<x−3<4, so −1<x<7.",1,"A less-than absolute value gives one interval; a greater-than gives two pieces."],["Solve −2x+6 > 10",["x>−2","x<−2","x>2","x<2"],1,"−2x>4, divide by −2 and flip: x<−2.",0,"Dividing by a negative flips the inequality sign."],["Solve x²−5x+6 ≤ 0",["[2,3]","(−∞,2]∪[3,∞)","(2,3)","[−3,−2]"],0,"(x−2)(x−3)≤0, so 2≤x≤3.",1,"Upward parabola: ≤0 means on or below the axis, between the roots."],["Nature of roots of 2x²−4x+5=0:",["D=−24, no real roots","D=24, two roots","D=0, one root","D=−24, two roots"],0,"D=16−40=−24.",1,"Negative discriminant means no real roots."]],
3:[["Domain of f(x)=√(x−4):",["x>4","x≥4","x≤4","all reals"],1,"x−4≥0, so x≥4.",0,"Inside a square root must be ≥0."],["Minimum value of x²−6x+5:",["−4","5","3","−9"],0,"Vertex x=3, f(3)=9−18+5=−4.",1,"Upward parabola has a minimum at x=−b/2a."],["C=2000+15x, price 40 per unit. Break-even units:",["50","80","100","133"],1,"2000/(40−15)=80.",1,"Fixed cost divided by profit per unit."],["f(x)=2x+1, g(x)=x². f(g(3)) =",["19","49","13","36"],0,"g(3)=9, f(9)=19.",1,"Inner function first. g(f(3)) would be 49."],["Qd=100−2P, Qs=20+2P. Equilibrium price:",["10","20","30","40"],1,"100−2P=20+2P, so P=20 (Q=60).",1,"Equilibrium is where demand equals supply."]],
4:[["First step in an LP problem:",["Evaluate corners","Define decision variables","Shade the region","Pick the answer"],1,"Variables come first, then objective and constraints.",0,"Wrong variables make everything after wrong."],["Max P=3x+2y: x+y≤4, x≤3, x,y≥0. Maximum P:",["9","11","8","12"],1,"Corners give 0, 9, 11, 8.",1,"Test every corner of the feasible region."],["Intersection of x+y=6 and x−y=2:",["(3,3)","(4,2)","(2,4)","(5,1)"],1,"Add: 2x=8, x=4, y=2.",0,"Use elimination to find corner points."],["Tables take 3h, chairs 2h, 120h available. Constraint:",["3x+2y≥120","3x+2y≤120","2x+3y≤120","3x+2y=60"],1,"Hours used cannot exceed hours available.",1,"Limited resource means ≤."],["Min C=2x+3y: x+y≥5, x,y≥0. Minimum:",["10","15","5","0"],0,"Corners (5,0) gives 10 and (0,5) gives 15.",1,"(0,0) is not feasible because x+y must be at least 5."]],

6:[["AP 5,9,13…: 10th term:",["41","45","37","49"],0,"5+9·4=41.",0,"aₙ=a+(n−1)d."],["Sum of first 10 terms of 5,9,13…:",["230","205","460","190"],0,"10/2·(10+36)=230.",1,"Sₙ=n/2·(2a+(n−1)d)."],["GP 3,6,12…: 6th term:",["96","48","192","72"],0,"3·2⁵=96.",0,"aₙ=a·rⁿ⁻¹, so use exponent 5."],["Infinite sum 12+6+3+…",["24","18","36","No sum"],0,"12/(1−1/2)=24.",1,"Valid only because |r|=0.5<1."],["5,000 birr at 10% compound, 2 years:",["6,000","6,050","6,100","5,500"],1,"5000×1.1²=6050.",1,"Simple interest gives 6,000. The extra 50 is interest on interest."]],
7:[["Mean of 4,8,6,5,7:",["5","6","7","8"],1,"30÷5=6.",0,"Add all values, divide by how many."],["Median of 3,9,1,7,5,11:",["5","6","7","6.5"],1,"Sorted 1,3,5,7,9,11. Middle two 5 and 7 average to 6.",1,"Always sort first. Even count means average the middle two."],["Mode of 2,3,3,5,5,5,7:",["3","5","7","2"],1,"5 appears 3 times.",0,"Mode is the most frequent value."],["Sample variance of 2,4,4,6,9:",["5.6","7","28","5"],1,"Mean 5, sum of squares 28, 28/4=7.",1,"Population variance would be 28/5=5.6. Check which your lecturer uses."],["Least affected by an extreme outlier:",["Mean","Median","Range","Std deviation"],1,"The median depends on position, not size.",0,"Use the median for skewed data such as salaries."]],
8:[["d/dx (5x³) =",["15x²","5x²","15x³","3x²"],0,"Bring down 3, multiply 5·3=15, reduce power to 2.",0,"Power rule: n·xⁿ⁻¹."],["Derivative of x²+3x−7 at x=2:",["7","9","3","4"],0,"2x+3 at x=2 is 7.",0,"Differentiate first, then substitute."],["lim x→2 (x²−4)/(x−2) =",["0","2","4","Undefined"],2,"(x+2)(x−2)/(x−2)=x+2, which is 4.",1,"0/0 means factor and cancel, not undefined."],["C=x²+10x+100. Marginal cost at x=5:",["20","15","175","10"],0,"C′=2x+10, so 20.",1,"Marginal cost is the derivative, not the cost value."],["R=50x−x², C=x²+10x+100. Profit-maximising x:",["5","10","20","40"],1,"P′=40−4x=0, so x=10. Same as MR=MC.",1,"Confirm with P″=−4<0."]]};
var ADV={};
QQ[2]=QQ[2].concat([["Solve |2x+1| > 3",["x<−2 or x>1","−2<x<1","x>1","x<−2"],0,"2x+1>3 gives x>1; 2x+1<−3 gives x<−2.",1,"A greater-than absolute value splits into two outer pieces joined by or."],["Solve (x−1)/(x+2) ≥ 0",["x<−2 or x≥1","−2<x≤1","x≤−2 or x≥1","x≥1 only"],0,"Critical points −2 and 1. Positive outside, zero at 1; x=−2 is excluded.",1,"Never include a value that makes the denominator zero."],["Integers satisfying −2 < x ≤ 3:",["4","5","6","7"],1,"x = −1, 0, 1, 2, 3, which is 5 integers.",0,"The open end excludes −2; the closed end includes 3."]]);
