<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
#bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#0d1017ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#bar b{font-size:17px;flex:1}#bar b span{color:var(--ac)}.xp{background:var(--p2);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--gold)}
main{max-width:680px;margin:0 auto;padding:14px 14px 100px}

#nav button{flex:1;padding:10px 0 8px;background:none;border:0;color:var(--mut);font-size:11px;font-weight:600}#nav button i{display:block;font-style:normal;font-size:20px}#nav button.on{color:var(--ac)}
h2{margin:6px 0 10px;font-size:20px}h3{margin:18px 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.hero{background:linear-gradient(135deg,#0b3b66,#31a8ff 70%,#00e0c6);border-radius:20px;padding:18px;margin-bottom:6px}.hero h2{margin:0}.hero p{margin:6px 0 0;opacity:.92;font-size:14px}
.node{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--p);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0;color:var(--ink);font-size:15px}
.node small{display:block;color:var(--mut)}.dot{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--p2);color:var(--ac)}.done .dot{background:var(--ok);color:#06251a}
.l0{--lc:#3ddc97}.l1{--lc:#31a8ff}.l2{--lc:#ffc94d}.node{border-left:4px solid var(--lc)}
.badge{display:inline-block;background:var(--lc);color:#08111c;font-weight:800;font-size:11px;padding:3px 10px;border-radius:99px}
.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
svg{width:100%;height:auto;border-radius:12px;display:block;margin:10px 0}svg text{font:600 9px system-ui;fill:#e9eef7}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}.steps li{counter-increment:s;display:flex;gap:10px;margin:8px 0}.steps li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ac);color:#06131f;font-weight:800;font-size:13px;display:grid;place-items:center}
.tip{background:#31a8ff1a;border-left:4px solid var(--ac);padding:9px 12px;border-radius:0 12px 12px 0;font-size:14px}
.try{background:#ffc94d1a;border:1.5px dashed var(--gold);border-radius:14px;padding:12px;margin:12px 0}.try b{color:var(--gold)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;border:0;background:var(--ac);color:#06131f;font-weight:800;font-size:15px;margin:8px 0}.btn.o{background:none;border:1.5px solid var(--ac);color:var(--ac)}.btn.ok{background:var(--ok)}
.row{display:flex;gap:8px}.row .btn{flex:1}.back{background:none;border:0;color:var(--ac);font-weight:700;font-size:15px;padding:6px 0}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font-size:15px}.opt.good{background:#3ddc9730;border-color:var(--ok)}.opt.bad{background:#ff6b6b30;border-color:var(--bad);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mc{aspect-ratio:1.2;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font-size:13px;font-weight:700;padding:4px}.mc.up{background:var(--ac);color:#06131f}.mc.mt{background:var(--ok);color:#06251a}
.bar{height:10px;border-radius:6px;background:var(--p2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--p);color:var(--ink);font-size:15px;margin-bottom:8px}
.kb{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.kb code{background:var(--p2);color:var(--ac);padding:3px 8px;border-radius:8px;font-size:13px;min-width:112px;text-align:center}
.lock{text-align:center;border:1.5px dashed var(--gold);border-radius:16px;padding:22px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,40px);opacity:0;background:var(--gold);color:#241a00;font-weight:800;padding:9px 18px;border-radius:99px;transition:.3s;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}

<script>

const L=[
[0,"Meet the workspace",10,"Think of Photoshop as a digital desk: tools on the left, panels on the right and your picture, the canvas, in the middle. Use 72 ppi for screens and 300 ppi for print.",["Press Ctrl+N and pick a Web or Print preset.","Find Tools (left), Properties (right) and Layers (bottom right).","Zoom with Ctrl+ and Ctrl−. Hold Space and drag to move around.","Ctrl+Z undoes once. Ctrl+Alt+Z steps back many times."],"Save as .psd so your layers stay editable.","Create a 1080 × 1080 px document, zoom to 300%, then press Ctrl+0 to fit it back on screen.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><rect x="6" y="6" width="30" height="138" rx="5" fill="var(--p2)"/><rect x="240" y="6" width="54" height="138" rx="5" fill="var(--p2)"/><rect x="48" y="14" width="180" height="122" fill="#fff"/><circle cx="138" cy="75" r="30" fill="var(--ac)"/><text x="8" y="20">Tools</text><text x="243" y="20">Layers</text><text x="110" y="128" style="fill:#555">Canvas</text></svg>`],
[0,"Layers: transparent sheets",12,"Imagine stacking clear plastic sheets, each carrying one part of your design. You can move, hide or change one sheet without touching the rest. Almost everything in Photoshop builds on this idea.",["Open Window → Layers (F7).","Click the eye to hide a layer and the padlock to lock it.","Press Ctrl+J to duplicate. Drag a layer up or down to change what is in front.","Select layers and press Ctrl+G to group them."],"Double-click a layer name and rename it. Future you will be grateful.","Place three shapes on three layers, then swap which one is in front without redrawing anything.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><rect x="40" y="70" width="150" height="64" rx="6" fill="#3b4258"/><rect x="62" y="48" width="150" height="64" rx="6" fill="var(--ac)" opacity=".9"/><rect x="84" y="26" width="150" height="64" rx="6" fill="var(--gold)" opacity=".92"/><text x="92" y="62" style="fill:#241a00">Text layer</text><text x="70" y="84" style="fill:#06131f">Photo layer</text><text x="48" y="128">Background</text></svg>`],
[0,"Select, crop and move",12,"To edit one part of a picture you first tell Photoshop which part. Quick Selection (W) works like painting over the area, and Select Subject finds the person or object for you.",["Press W and drag over the object.","Hold Alt and paint to remove parts you selected by mistake.","Ctrl+Shift+I inverts the selection. Ctrl+D removes it.","Press C to crop, drag the edges and press Enter."],"After selecting, open Select and Mask to clean hair and edges.","Cut a person out of a photo and put them on their own layer with Ctrl+J.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><circle cx="150" cy="58" r="22" fill="#8aa0c4"/><rect x="120" y="82" width="60" height="50" rx="14" fill="#8aa0c4"/><path d="M118 134 L118 80 Q118 36 150 34 Q182 36 182 80 L182 134 Z" fill="none" stroke="var(--ac2)" stroke-width="2" stroke-dasharray="5 4"/><text x="196" y="70">Marching ants</text><text x="196" y="82">= selection</text></svg>`],
[0,"Brush, colour and text",12,"The Brush (B) paints and the Type tool (T) writes. The two colour squares at the bottom of the Tools panel are your Foreground and Background colours.",["Press B. Use [ and ] to change the brush size.","Press X to swap foreground and background. Press D for black and white.","Press I and click a photo to pick its exact colour.","Press T, click the canvas, type, then style it in the Character panel."],"Soft brush for shadows. Hard brush for clean edges.","Write your name in a colour you picked from a photo with the Eyedropper.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><path d="M30 100 C 80 30, 130 130, 190 60 S 260 70 270 50" fill="none" stroke="var(--ac)" stroke-width="12" stroke-linecap="round" opacity=".85"/><rect x="30" y="112" width="26" height="26" fill="var(--ac)" stroke="#fff"/><rect x="44" y="124" width="26" height="26" fill="#fff" stroke="#888"/><text x="80" y="136">Foreground / Background</text></svg>`],
[1,"Masks: hide, never erase",15,"The Eraser destroys pixels forever. A layer mask only hides them, so you can bring them back anytime. White reveals, black hides, grey shows half.",["Select a layer and click the mask icon (a rectangle with a circle) under the Layers panel.","Press B, choose black and paint over what you want to hide.","Press X to switch to white and paint it back.","Use a soft, low-opacity brush to blend two photos smoothly."],"Alt-click the mask thumbnail to see the black and white mask itself.","Blend two photos into one with a smooth sky-to-ground fade using only a mask.",`<svg viewBox="0 0 300 150"><defs><linearGradient id="mk"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient></defs><rect width="300" height="150" rx="10" fill="#10141c"/><rect x="20" y="24" width="100" height="90" rx="6" fill="url(#mk)"/><text x="30" y="132">Mask: white = show</text><path d="M135 70 L165 70" stroke="var(--ac)" stroke-width="3"/><rect x="180" y="24" width="100" height="90" rx="6" fill="var(--ac)" opacity=".9"/><rect x="230" y="24" width="50" height="90" rx="6" fill="#10141c" opacity=".7"/><text x="186" y="132">black = hidden</text></svg>`],
[1,"Colour correction without damage",15,"Put brightness, contrast and colour changes on adjustment layers instead of the photo itself. You can change your mind forever. Levels and Curves give the best control.",["Click the half-black circle in the Layers panel and choose Levels or Curves.","Drag the black and white sliders to the edges of the histogram.","Use Vibrance or Hue/Saturation for colour strength.","Click the eye on the adjustment to compare before and after."],"Avoid Image → Adjustments. They change the pixels permanently.","Rescue a dull, dark photo using only two adjustment layers.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><g fill="#6b7790"><rect x="30" y="80" width="12" height="50"/><rect x="46" y="60" width="12" height="70"/><rect x="62" y="70" width="12" height="60"/><rect x="78" y="100" width="12" height="30"/></g><g fill="var(--ac)"><rect x="170" y="90" width="12" height="40"/><rect x="186" y="60" width="12" height="70"/><rect x="202" y="40" width="12" height="90"/><rect x="218" y="64" width="12" height="66"/><rect x="234" y="90" width="12" height="40"/></g><text x="38" y="30">Before: crowded</text><text x="178" y="30">After: full range</text><text x="118" y="146">Levels</text></svg>`],
[1,"Retouching: clean and natural",15,"Good retouching is invisible. Heal blemishes, keep real texture and never overdo it.",["Make a new empty layer above the photo.","Press J (Spot Healing), tick Sample All Layers and click the blemish.","Press S (Clone Stamp): Alt-click a clean area, then paint.","Remove bigger objects with Edit → Content-Aware Fill."],"Check at 100% zoom, then zoom out. It must still look natural.","Remove a small object (a bin, a wire or a spot) from any photo without a trace.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><circle cx="80" cy="75" r="46" fill="#e8b895"/><circle cx="66" cy="66" r="4" fill="#a1553a"/><circle cx="96" cy="88" r="3" fill="#a1553a"/><path d="M140 75 H168" stroke="var(--ac)" stroke-width="3"/><circle cx="228" cy="75" r="46" fill="#e8b895"/><text x="40" y="140">Before</text><text x="206" y="140">After</text></svg>`],
[1,"Smart objects and Free Transform",15,"A normal layer loses quality if you shrink it and enlarge it again. A smart object remembers the original, so resizing is safe.",["Right-click the layer and choose Convert to Smart Object.","Press Ctrl+T, hold Shift and drag a corner.","Double-click the smart object icon to edit its contents (used in mockups).","Press Enter to confirm."],"Use File → Place Embedded for logos and photos.","Shrink a logo to 10%, then back to 100%, once as a normal layer and once as a smart object. Compare the sharpness.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><g fill="var(--ac)"><rect x="40" y="40" width="20" height="20"/><rect x="80" y="40" width="20" height="20"/><rect x="60" y="60" width="20" height="20"/><rect x="40" y="80" width="20" height="20"/><rect x="80" y="80" width="20" height="20"/></g><circle cx="220" cy="70" r="36" fill="var(--ac)"/><text x="34" y="130">Normal: blocky</text><text x="180" y="130">Smart: sharp</text></svg>`],
[2,"Blend modes and layer styles",18,"A blend mode decides how a layer mixes with the one underneath. Multiply darkens (shadows), Screen lightens (glows), Overlay and Soft Light add contrast.",["Select a layer and open the blend mode menu at the top of the Layers panel.","Use Multiply for shadows and Screen for light effects.","Double-click the layer to add Drop Shadow, Stroke or Gradient Overlay.","Lower the opacity until it looks natural."],"Soft Light on a 50% grey layer is the classic dodge-and-burn trick.","Add a realistic shadow under a cut-out object using a Multiply layer.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><rect x="20" y="30" width="60" height="70" rx="8" fill="#e8b895"/><rect x="95" y="30" width="60" height="70" rx="8" fill="#e8b895"/><rect x="170" y="30" width="60" height="70" rx="8" fill="#e8b895"/><rect x="20" y="30" width="60" height="70" rx="8" fill="#5a3a8a" opacity=".6"/><rect x="95" y="30" width="60" height="70" rx="8" fill="#5a3a8a" opacity=".25"/><circle cx="260" cy="64" r="18" fill="var(--ac2)"/><text x="26" y="120">Multiply</text><text x="106" y="120">Screen</text><text x="176" y="120">Overlay</text></svg>`],
[2,"Compositing: make it believable",20,"To merge objects from different photos, match three things: the direction of light, the colour and the sharpness. If the sun is on the left, shadows fall to the right.",["Cut out the object and place it on the new background.","Match colours with a Curves or Color Balance layer clipped to the object (Ctrl+Alt+G).","Paint a soft shadow on a Multiply layer.","Add a little blur or noise so both parts match."],"Squint at the image. If something pops out, its brightness or colour is off.","Place a product or person into a new scene so a friend cannot tell it is edited.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><circle cx="40" cy="30" r="16" fill="var(--gold)"/><path d="M52 40 L130 84" stroke="var(--gold)" stroke-dasharray="4"/><rect x="130" y="50" width="44" height="64" rx="8" fill="var(--ac)"/><ellipse cx="200" cy="120" rx="40" ry="8" fill="#000" opacity=".6"/><text x="190" y="76">Light from left</text><text x="190" y="88">Shadow to right</text></svg>`],
[2,"Poster and social media design",20,"Great designs guide the eye: one big headline, one supporting line and one clear action. Leave space to breathe.",["Create a 1080 × 1350 px document (Instagram portrait).","Choose one image, one headline font and one accent colour.","Set three text sizes: big title, small subtitle, tiny details.","Align everything to guides and keep margins equal."],"If you need a third font, you probably need fewer elements.","Design a poster for an imaginary event using one font family and two colours.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><rect x="100" y="8" width="100" height="134" rx="6" fill="var(--p2)" stroke="var(--ac)"/><rect x="110" y="18" width="80" height="44" fill="var(--ac)" opacity=".6"/><rect x="110" y="70" width="80" height="12" fill="#fff"/><rect x="110" y="88" width="56" height="6" fill="#8896ad"/><rect x="110" y="118" width="40" height="14" rx="7" fill="var(--gold)"/><text x="206" y="76">1 Headline</text><text x="206" y="94">2 Subtitle</text><text x="206" y="126">3 Action</text></svg>`],
[2,"Export and work faster",18,"Export is the last step, so do it right. PNG keeps transparency, JPG makes small files for photos and WebP is light for websites. Actions record repeated work for you.",["Choose File → Export → Export As (Ctrl+Alt+Shift+W).","Pick JPG for photos or PNG for logos. Quality 80–90 is a good balance.","Use sRGB so colours look right on phones.","Record repeated steps in Window → Actions, then run them on a folder with File → Automate → Batch."],"Always keep the layered .psd. Export copies, never overwrite.","Export one design as PNG and JPG at 1080 × 1350 px and compare the file sizes.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#10141c"/><rect x="16" y="30" width="80" height="76" rx="8" fill="var(--p2)"/><rect x="110" y="30" width="80" height="76" rx="8" fill="var(--p2)"/><rect x="204" y="30" width="80" height="76" rx="8" fill="var(--p2)"/><text x="40" y="62" style="font-size:14px;fill:var(--ac)">PNG</text><text x="134" y="62" style="font-size:14px;fill:var(--ok)">JPG</text><text x="222" y="62" style="font-size:14px;fill:var(--gold)">WebP</text><text x="28" y="90">Transparent</text><text x="126" y="90">Photos</text><text x="222" y="90">Web, light</text><text x="96" y="132">1080 × 1350 px · sRGB</text></svg>`]
];
const SC=[["Ctrl+J","Duplicate layer"],["Ctrl+T","Free Transform"],["Ctrl+D","Deselect"],["Ctrl+Shift+I","Invert selection"],["X","Swap colours"],["Ctrl+Z","Undo"],["V","Move tool"],["B","Brush"],["W","Quick Selection"],["J","Spot Healing"],["S","Clone Stamp"],["C","Crop"],["T","Type tool"],["Ctrl+0","Fit on screen"],["Ctrl+G","Group layers"],["Alt+click mask","View the mask"]];

 return '<h2>Play and practise</h2>'+A.map(a=>`<button class="node" data-a="act" data-k="${a[0]}"><span class="dot">${a[1]}</span><span><b>${a[2]}</b><small>${a[3]}${FREE&&a[0]!="order"?" · 🔒":""}</small></span></button>`).join("")}
function actv(){const k=act,back='<button class="back" data-a="plist">← Back</button>';if(FREE&&k!="order")return back+lockCard();
 if(k=="order"){if(!ord)ord={it:sh([0,1,2,3,4,5]),q:[]};return back+`<h2>🧩 Workflow puzzle</h2><p>Tap the steps in the order a careful editor would do them.</p>${ord.it.map(i=>`<button class="opt ${ord.q.includes(i)?"good":""}" data-a="ord" data-i="${i}">${ord.q.includes(i)?ord.q.indexOf(i)+1+". ":""}${ORD[i]}</button>`).join("")}${ord.q.length==6?'<div class="tip">🎉 Perfect! Always protect the original first and export last.</div><button class="btn" data-a="reset" data-k="order">Play again</button>':""}`}
 if(k=="mistake"){if(!mis)mis={i:0,o:null};if(mis.i>=3)return back+'<h2>🕵️ All fixed!</h2><div class="tip">You found all 3 fixes. These are the most common beginner mistakes.</div><button class="btn" data-a="reset" data-k="mistake">Play again</button>';const m=MIS[mis.i];if(!mis.o)mis.o=sh(m[1]);return back+`<h2>🕵️ Spot the mistake ${mis.i+1}/3</h2><p><b>${m[0]}</b></p>${mis.o.map(o=>`<button class="opt" data-a="mis" data-v="${o==m[1][0]?1:0}">${o}</button>`).join("")}`}
 if(k=="memory"){if(!mem)mem={c:sh(SC.slice(0,6).flatMap((s,i)=>[{t:s[0],p:i},{t:s[1],p:i}])),o:[],m:[],mv:0};return back+`<h2>🃏 Shortcut memory</h2><p>Moves: ${mem.mv} · Pairs: ${mem.m.length/2}/6</p><div class="mem">${mem.c.map((c,i)=>{const up=mem.o.includes(i),mt=mem.m.includes(i);return `<button class="mc ${mt?"mt":up?"up":""}" data-a="flip" data-i="${i}">${up||mt?c.t:"?"}</button>`}).join("")}</div>${mem.m.length==12?'<div class="tip">🎉 Done in '+mem.mv+' moves!</div><button class="btn" data-a="reset" data-k="memory">Play again</button>':""}`}
 return back+'<h2>🏆 Design challenges</h2>'+CH.map((c,i)=>`<div class="card"><b>${i+1}. ${c[0]}</b><p>${c[1]}</p><details><summary style="color:var(--ac)">Need a hint?</summary><p>${c[2]}</p></details><button class="btn ${S.c.includes(i)?"ok":"o"}" data-a="cdone" data-i="${i}">${S.c.includes(i)?"✔ Done":"I did it (+50 XP)"}</button></div>`).join("")}
function cheat(q=""){return `<h2>Shortcut cheat sheet</h2><p style="color:var(--mut);font-size:14px">On Mac use Cmd for Ctrl and Option for Alt.</p><input id="q" placeholder="Search a shortcut or action…" value="${q}">${SC.filter(s=>(s[0]+s[1]).toLowerCase().includes(q.toLowerCase())).map(s=>`<div class="kb"><code>${s[0]}</code><span>${s[1]}</span></div>`).join("")||"<p>No match.</p>"}`}
function me(){const p=xp(),lv=p<100?"Beginner":p<250?"Retoucher":p<450?"Compositor":"Pro Designer",nx=p<100?100:p<250?250:p<450?450:580,
 d=v=>L.filter((x,i)=>x[0]==v&&S.d.includes(i)).length,B=[["🌱","First lesson",S.d.length>0],["🟢","Basic done",d(0)==4],["🔵","Intermediate done",d(1)==4],["🟡","Advanced done",d(2)==4],["🧠","Puzzle master",S.p.length>=3],["🏆","3 challenges",S.c.length>=3]];
 return `<h2>Your progress</h2><div class="card"><b style="font-size:22px">${lv}</b><p style="margin:4px 0 8px;color:var(--mut)">${p} XP · next goal ${nx} XP</p><div class="bar"><i style="width:${Math.min(100,p/nx*100)}%"></i></div></div><h3>Badges</h3><div class="card">${B.map(b=>`<div class="kb" style="opacity:${b[2]?1:.35}"><span style="font-size:22px">${b[0]}</span><span>${b[1]}</span></div>`).join("")}</div><button class="btn o" data-a="wipe">Reset my progress</button>`}
function render(){$("#xp").textContent="⭐ "+xp()+" XP";
 $("#nav").innerHTML=[["path","🗺️","Learn"],["play","🎮","Play"],["cheat","⌨️","Shortcuts"],["me","🏅","Progress"]].map(n=>`<button class="${tab==n[0]?"on":""}" data-t="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join("");
 $("#app").innerHTML=tab=="path"?(cur!==null?lesson(cur):path()):tab=="play"?(act?actv():play()):tab=="cheat"?cheat():me();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(D.t){tab=D.t;cur=null;act=null;return render()}
 if(D.a=="open"){cur=+D.i;render()}else if(D.a=="list"){cur=null;render()}
 else if(D.a=="done"){const i=+D.i;if(lockd(L[i][0]))return;award("d",i,20);render();scrollTo(0,document.body.scrollHeight)}
 else if(D.a=="act"){act=D.k;render()}else if(D.a=="plist"){act=null;ord=mem=mis=null;render()}
 else if(D.a=="ord"){const i=+D.i;if(ord.q.includes(i))return;if(i==ord.q.length){ord.q.push(i);if(ord.q.length==6)award("p","order",30);render()}else{t.classList.add("bad");toast("Not yet. What must happen first?");setTimeout(()=>t.classList.remove("bad"),500)}}
 else if(D.a=="mis"){if(D.v=="1"){mis.i++;mis.o=null;if(mis.i>=3)award("p","mistake",30);render()}else{t.classList.add("bad");toast("Close, but think again")}}
 else if(D.a=="flip"){const i=+D.i;if(mem.o.length>=2||mem.o.includes(i)||mem.m.includes(i))return;mem.o.push(i);if(mem.o.length==2){mem.mv++;const[a,b]=mem.o;if(mem.c[a].p==mem.c[b].p){mem.m.push(a,b);mem.o=[];if(mem.m.length==12)award("p","memory",30)}else setTimeout(()=>{mem.o=[];render()},800)}render()}
 else if(D.a=="reset"){if(D.k=="order")ord=null;if(D.k=="mistake")mis=null;if(D.k=="memory")mem=null;render()}
 else if(D.a=="cdone"){const i=+D.i;if(S.c.includes(i)){S.c=S.c.filter(x=>x!=i);sv("ps",JSON.stringify(S))}else award("c",i,50);render()}
 else if(D.a=="wipe"&&confirm("Reset all progress?")){S={d:[],p:[],c:[]};sv("ps",JSON.stringify(S));render()}});
document.addEventListener("input",e=>{if(e.target.id=="q"){$("#app").innerHTML=cheat(e.target.value);const q=$("#q");q.focus();q.setSelectionRange(99,99)}});
render();
</script></body></html>
