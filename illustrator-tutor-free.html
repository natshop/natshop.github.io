<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adobe Illustrator Tutor – Basic to Advanced</title>
<style>
:root{--bg:#fff8f0;--card:#fff;--ink:#2a1a0a;--mut:#7a6552;--ac:#ff9a00;--ac2:#b85c00;--line:#f0dcc4;--c2:#ffe9cc;--c3:#ffcf8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150e07;--card:#21160b;--ink:#fbeedd;--mut:#c4a98c;--ac2:#ffb347;--line:#3a2813;--c2:#3a2813;--c3:#6b4513}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif}
main{max-width:700px;margin:0 auto;padding:0 14px 40px}
.hero{background:linear-gradient(135deg,#2b1300,#7a3d00 55%,#ff9a00);color:#fff;border-radius:0 0 24px 24px;margin:0 -14px;padding:22px 18px}
.hero h1{margin:0;font-size:25px}.hero p{margin:4px 0 12px;font-size:14px;opacity:.92}
.bar{height:9px;background:#ffffff40;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
.tabs{display:flex;gap:8px;margin:14px 0}.tabs button{flex:1;padding:11px 4px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.tabs button.on{background:var(--ac);color:#2b1300;border-color:var(--ac)}
details{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
summary{padding:14px;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}.n{background:var(--ac);color:#2b1300;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:13px;flex:none}
.in{padding:0 14px 14px}svg{width:100%;height:auto;border-radius:12px;display:block;margin-bottom:10px}svg text{font:600 9px system-ui;fill:var(--ink)}
ol{padding-left:20px;margin:8px 0}li{margin:4px 0}
.tip{border-left:4px solid var(--ac);background:var(--c2);padding:8px 10px;border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
.done{width:100%;padding:11px;border-radius:12px;border:1.5px solid var(--ac);background:none;color:var(--ac2);font-weight:700}.done.on{background:var(--ac);color:#2b1300}
h2{font-size:18px;margin:22px 0 6px;color:var(--ac2)}
.q{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:10px 0}
.o{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px}
.o.ok{background:#1f9d5530;border-color:#1f9d55}.o.no{background:#d9382a30;border-color:#d9382a}.ex{font-size:14px;color:var(--mut)}
.lock{text-align:center;padding:22px;background:var(--card);border:1.5px dashed var(--ac);border-radius:16px;margin:12px 0}
</style></head><body><main>
<div class="hero"><h1>✒️ Adobe Illustrator Tutor</h1><p>Picture-guided lessons · Basic, Intermediate, Advanced</p><div class="bar"><i id="pb"></i></div><small id="pt"></small></div>
<div class="tabs" id="tabs"></div><div id="list"></div>
<script>
const FREE=true;
const LV=["Basic","Intermediate","Advanced"];
const L=[
[0,"Workspace and artboards","Illustrator is vector software: shapes are made of math, so they stay sharp at any size. Know the layout first: Tools on the left, Properties on the right, and your white artboard in the centre.",["File → New (Ctrl/Cmd+N), choose Print or Web, set the size.","Open Window → Properties and Layers to show your panels.","Zoom with Ctrl/Cmd and + or −. Hold Space to drag the view (Hand tool).","Add more artboards with the Artboard tool (Shift+O)."],"Save as .ai to keep everything editable. Export PNG or PDF only for sharing.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><rect x="6" y="6" width="34" height="138" rx="4" fill="var(--c3)"/><rect x="260" y="6" width="34" height="138" rx="4" fill="var(--c3)"/><rect x="62" y="22" width="176" height="108" fill="#fff" stroke="var(--ac)" stroke-width="2"/><circle cx="150" cy="80" r="26" fill="var(--ac)"/><text x="9" y="20">Tools</text><text x="262" y="20">Props</text><text x="112" y="38" style="fill:#555">Artboard</text></svg>`],
[0,"Shapes and selection","Every logo starts from simple shapes. Learn two selection tools: Selection (V) moves whole objects and Direct Selection (A) edits single anchor points.",["Press M for Rectangle or L for Ellipse and drag.","Hold Shift for a perfect square or circle. Hold Alt/Option to draw from the centre.","Press V to move or resize. Press A to pull a single corner point.","Use the round-corner dot (live corners) to soften a rectangle."],"Click once on an empty area to deselect before starting a new shape.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><rect x="40" y="40" width="90" height="70" fill="var(--ac)"/><g fill="#fff" stroke="var(--ink)"><rect x="36" y="36" width="8" height="8"/><rect x="126" y="36" width="8" height="8"/><rect x="36" y="106" width="8" height="8"/><rect x="126" y="106" width="8" height="8"/></g><circle cx="215" cy="75" r="38" fill="var(--c3)"/><text x="40" y="132">Anchor points</text><text x="170" y="132">Shift = perfect circle</text></svg>`],
[0,"Color, stroke and gradient","Fill is the colour inside a shape and stroke is the outline. Gradients blend two or more colours, which gives logos depth.",["Double-click the Fill box in the Tools panel and pick a colour.","Set stroke weight in the Properties panel (try 4 pt).","Press G for Gradient and drag across the shape to set direction.","Press I (Eyedropper) and click an object to copy its look."],"Press Shift+X to swap fill and stroke. Press D for the default black and white.",`<svg viewBox="0 0 300 150"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#e0245e"/></linearGradient></defs><rect width="300" height="150" rx="8" fill="var(--c2)"/><circle cx="90" cy="75" r="50" fill="url(#g1)"/><circle cx="215" cy="75" r="36" fill="none" stroke="var(--ac2)" stroke-width="10"/><text x="50" y="140">Gradient fill</text><text x="180" y="140">Stroke only</text></svg>`],
[0,"Type, align and group","Text sells the message. Use the Type tool, then keep everything neat with the Align panel and Groups.",["Press T, click the artboard and type. Choose a font in the Character panel.","Select two or more objects. Open Window → Align and choose Align Left or Horizontal Centre.","Press Ctrl/Cmd+G to group. Press Ctrl/Cmd+Shift+G to ungroup.","Before sending to a printer, choose Type → Create Outlines (Ctrl/Cmd+Shift+O)."],"Use no more than two fonts in one design.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><line x1="60" y1="16" x2="60" y2="134" stroke="var(--ac)" stroke-dasharray="4"/><rect x="60" y="28" width="120" height="16" fill="var(--ac)"/><rect x="60" y="58" width="80" height="16" fill="var(--c3)"/><rect x="60" y="88" width="160" height="16" fill="var(--ac)"/><text x="70" y="124">Align Left: edges line up</text></svg>`],
[1,"Pen tool and curves","The Pen tool draws any shape. A click makes a corner point. Click and drag makes a smooth curve with handles. Fewer points give smoother curves.",["Press P. Click for straight lines.","Click and drag to pull out handles and curve the line.","Click the first point again to close the shape.","Use + and − to add or delete points. Shift+C converts a point."],"Place anchor points at the start and end of each curve, not in the middle.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><path d="M30 120 C 90 10, 210 10, 270 120" fill="none" stroke="var(--ac2)" stroke-width="4"/><path d="M30 120 L90 10 M270 120 L210 10" stroke="var(--ink)" stroke-dasharray="3"/><g fill="#fff" stroke="var(--ink)"><rect x="26" y="116" width="8" height="8"/><rect x="266" y="116" width="8" height="8"/></g><g fill="var(--ac)"><circle cx="90" cy="10" r="4"/><circle cx="210" cy="10" r="4"/></g><text x="100" y="140">Anchor points and handles</text></svg>`],
[1,"Pathfinder and Shape Builder","Combine simple shapes to build complex ones. This is how most professional logos are made.",["Draw two overlapping shapes and select both.","Open Window → Pathfinder. Unite merges, Minus Front cuts, Intersect keeps the overlap.","Or press Shift+M for Shape Builder: drag across the parts to merge, hold Alt/Option and click to delete.","Expand if asked, then recolour the new shape."],"Keep a copy of the original shapes off to the side in case you need to change them.",`<svg viewBox="0 0 300 150"><defs><clipPath id="c1"><circle cx="228" cy="75" r="28"/></clipPath></defs><rect width="300" height="150" rx="8" fill="var(--c2)"/><circle cx="50" cy="75" r="28" fill="none" stroke="var(--ink)"/><circle cx="72" cy="75" r="28" fill="none" stroke="var(--ink)"/><circle cx="140" cy="75" r="28" fill="var(--ac)"/><circle cx="162" cy="75" r="28" fill="var(--ac)"/><circle cx="206" cy="75" r="28" fill="var(--c3)"/><circle cx="228" cy="75" r="28" fill="var(--c3)"/><circle cx="206" cy="75" r="28" fill="var(--ac2)" clip-path="url(#c1)"/><text x="40" y="130">Two shapes</text><text x="125" y="130">Unite</text><text x="196" y="130">Intersect</text></svg>`],
[1,"Layers and clipping masks","Layers keep artwork organised. A clipping mask shows part of an image or pattern inside a shape.",["Open Window → Layers. Name layers: Background, Logo, Text.","Draw a circle on top of your artwork.","Select both and press Ctrl/Cmd+7 to make the clipping mask.","Press Ctrl/Cmd+Alt+7 to release it. Lock a layer with the padlock."],"Put the mask shape on top. Only the top object becomes the window.",`<svg viewBox="0 0 300 150"><defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff9a00"/><stop offset="1" stop-color="#7a3d00"/></linearGradient><clipPath id="cm"><circle cx="150" cy="70" r="52"/></clipPath></defs><rect width="300" height="150" rx="8" fill="var(--c2)"/><g clip-path="url(#cm)"><rect x="80" y="10" width="140" height="120" fill="url(#g3)"/><circle cx="130" cy="55" r="22" fill="#fff" opacity=".6"/></g><circle cx="150" cy="70" r="52" fill="none" stroke="var(--ink)" stroke-dasharray="4"/><text x="100" y="140">Only the circle area shows</text></svg>`],
[1,"Transform and repeat","Build patterns and symmetrical logos fast. Rotate, scale or reflect a copy, then repeat the same move.",["Draw one petal (an ellipse).","Press R (Rotate), Alt/Option-click the centre point, enter 60° and click Copy.","Press Ctrl/Cmd+D to repeat the same rotation.","Group all petals and recolour."],"Ctrl/Cmd+D (Transform Again) is the most useful shortcut for radial designs.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><g transform="translate(150 75)" fill="var(--ac)" fill-opacity=".8"><ellipse cy="-26" rx="10" ry="26"/><ellipse cy="-26" rx="10" ry="26" transform="rotate(60)"/><ellipse cy="-26" rx="10" ry="26" transform="rotate(120)"/><ellipse cy="-26" rx="10" ry="26" transform="rotate(180)"/><ellipse cy="-26" rx="10" ry="26" transform="rotate(240)"/><ellipse cy="-26" rx="10" ry="26" transform="rotate(300)"/></g><text x="95" y="143">Rotate 60° then Ctrl+D</text></svg>`],
[2,"Logo construction grid","Professional logos are built on a grid of circles and lines so proportions feel right. Use Smart Guides (Ctrl/Cmd+U) so objects snap to centres and edges.",["Turn on View → Smart Guides and View → Snap to Point.","Draw circles with sizes in a ratio, such as 1x, 2x and 3x.","Build the mark from those circles with Shape Builder.","Delete the guides, then test the logo in black and white and small sizes."],"If the logo is unclear at 32 px wide, simplify it.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><g stroke="var(--c3)"><line x1="150" y1="6" x2="150" y2="144"/><line x1="60" y1="75" x2="240" y2="75"/><line x1="90" y1="6" x2="90" y2="144"/><line x1="210" y1="6" x2="210" y2="144"/></g><circle cx="150" cy="75" r="60" fill="none" stroke="var(--ac2)"/><circle cx="150" cy="75" r="30" fill="var(--ac)"/><circle cx="150" cy="75" r="12" fill="var(--bg)"/><text x="196" y="136">Grid circles</text></svg>`],
[2,"Gradient mesh and freeform gradient","Add realistic shading and highlights. Mesh adds a grid of colour points to one shape. Freeform Gradient places colour points anywhere.",["Select a shape and press U (Mesh tool) or choose the Freeform option in the Gradient panel.","Click inside to add points. Click a point and change its colour.","Use lighter colours at the top-left for a highlight and darker colours at the bottom-right.","Keep the number of points low so the file stays light."],"Use mesh only on final artwork. It makes shapes hard to edit.",`<svg viewBox="0 0 300 150"><defs><radialGradient id="g4" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#ffb347"/><stop offset="1" stop-color="#b85c00"/></radialGradient></defs><rect width="300" height="150" rx="8" fill="var(--c2)"/><circle cx="150" cy="75" r="56" fill="url(#g4)"/><g stroke="#2b1300" stroke-opacity=".35" fill="none"><path d="M96 75 Q150 55 204 75"/><path d="M96 75 Q150 95 204 75"/><path d="M150 19 Q130 75 150 131"/><path d="M150 19 Q170 75 150 131"/></g><text x="100" y="146">Mesh points give soft shading</text></svg>`],
[2,"Image Trace and Recolor","Turn a sketch or photo into editable vector art with Image Trace, then change the whole palette in one step with Recolor Artwork.",["Place an image (File → Place) and select it.","Open Window → Image Trace and choose Black and White Logo or 6 Colors. Click Expand.","Select the artwork and choose Edit → Edit Colors → Recolor Artwork.","Make colours Global swatches so one edit changes the whole design."],"Start with a high-contrast, clean scan for the best trace.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><g><rect x="26" y="40" width="50" height="50" rx="10" fill="#ff9a00"/><circle cx="51" cy="65" r="12" fill="#2b1300"/><rect x="96" y="40" width="50" height="50" rx="10" fill="#1f9d55"/><circle cx="121" cy="65" r="12" fill="#06311a"/><rect x="166" y="40" width="50" height="50" rx="10" fill="#3b82f6"/><circle cx="191" cy="65" r="12" fill="#0b2a66"/><rect x="236" y="40" width="50" height="50" rx="10" fill="#e0245e"/><circle cx="261" cy="65" r="12" fill="#5a0a25"/></g><text x="60" y="120">One shape, four palettes</text></svg>`],
[2,"Export and brand system","Finish like a professional. Make one artboard per logo version and export the right format for every use.",["Create artboards for full colour, dark background and one colour.","Use RGB for screens and CMYK for print: File → Document Color Mode.","Export with File → Export → Export for Screens (Ctrl/Cmd+Alt+E): SVG and PNG for web, PDF for print.","Save a brand sheet with colours, fonts and logo spacing."],"Always keep the original .ai file. Clients may ask for changes later.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="8" fill="var(--c2)"/><rect x="12" y="24" width="86" height="86" rx="8" fill="#fff"/><rect x="107" y="24" width="86" height="86" rx="8" fill="#1a1109"/><rect x="202" y="24" width="86" height="86" rx="8" fill="#ffcf8a"/><circle cx="55" cy="67" r="22" fill="var(--ac)"/><circle cx="150" cy="67" r="22" fill="var(--ac)"/><circle cx="245" cy="67" r="22" fill="#2b1300"/><text x="22" y="128">Full colour</text><text x="120" y="128">Dark</text><text x="216" y="128">One colour</text></svg>`]
];
const Q=[
[0,"Shortcut for the Selection tool?",["V","A","P","T"],0,"V selects whole objects. A is Direct Selection."],
[0,"Hold which key to draw a perfect circle?",["Ctrl","Shift","Tab","Space"],1,"Shift keeps proportions equal."],
[0,"Shortcut to group objects?",["Ctrl/Cmd+G","Ctrl/Cmd+L","Ctrl/Cmd+7","Ctrl/Cmd+D"],0,"Ctrl/Cmd+G groups. Add Shift to ungroup."],
[1,"Click and drag with the Pen tool creates:",["A straight line","A curve with handles","A text box","A new artboard"],1,"The drag pulls out handles that shape the curve."],
[1,"Which Pathfinder option merges shapes into one?",["Unite","Intersect","Minus Front","Exclude"],0,"Unite joins them into a single shape."],
[1,"Shortcut to make a clipping mask?",["Ctrl/Cmd+7","Ctrl/Cmd+2","Ctrl/Cmd+U","Ctrl/Cmd+Z"],0,"Ctrl/Cmd+7 makes it. Add Alt to release."],
[2,"Best tool to vectorise a sketch?",["Image Trace","Eraser","Mesh","Blend"],0,"Image Trace turns pixels into editable paths."],
[2,"Before sending to a printer, convert text to:",["Outlines","Gradient","Symbols","Brushes"],0,"Create Outlines (Ctrl/Cmd+Shift+O) removes font problems."],
[2,"Which colour mode is for print?",["CMYK","RGB","Hex","Indexed"],0,"CMYK matches printer inks. RGB is for screens."]
];
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let lv=0,dn=new Set(JSON.parse(g("ai-done")||"[]"));
const $=s=>document.querySelector(s);
function prog(){const p=Math.round(dn.size/L.length*100);$("#pb").style.width=p+"%";$("#pt").textContent=dn.size+" of "+L.length+" lessons complete ("+p+"%)"}
function render(){
 $("#tabs").innerHTML=LV.map((n,i)=>`<button class="${i==lv?"on":""}" data-lv="${i}">${FREE&&i?"🔒 ":""}${n}</button>`).join("");
 if(FREE&&lv>0){$("#list").innerHTML='<div class="lock"><h2>🔒 Full version only</h2><p>Intermediate and Advanced lessons, pictures and quizzes are in the paid version (300 ETB).</p></div>';prog();return}
 let h="";L.forEach((x,i)=>{if(x[0]!=lv)return;h+=`<details><summary><span class="n">${i+1}</span>${x[1]}</summary><div class="in">${x[5]}<p>${x[2]}</p><ol>${x[3].map(s=>"<li>"+s+"</li>").join("")}</ol><div class="tip">💡 ${x[4]}</div><button class="done ${dn.has(i)?"on":""}" data-d="${i}">${dn.has(i)?"✔ Completed":"Mark as complete"}</button></div></details>`});
 h+="<h2>Quick quiz</h2>";Q.forEach((q,i)=>{if(q[0]!=lv)return;h+=`<div class="q"><b>${q[1]}</b>${q[2].map((o,k)=>`<button class="o" data-q="${i}" data-k="${k}">${o}</button>`).join("")}<div class="ex"></div></div>`});
 $("#list").innerHTML=h;prog()}
document.addEventListener("click",e=>{const t=e.target;
 if(t.dataset.lv!==undefined){lv=+t.dataset.lv;render()}
 if(t.dataset.d!==undefined){const i=+t.dataset.d;dn.has(i)?dn.delete(i):dn.add(i);sv("ai-done",JSON.stringify([...dn]));t.classList.toggle("on");t.textContent=dn.has(i)?"✔ Completed":"Mark as complete";prog()}
 if(t.dataset.q!==undefined){const q=Q[+t.dataset.q],b=t.parentNode.querySelectorAll(".o");if(b[0].disabled)return;b.forEach((x,k)=>{x.disabled=true;if(k==q[3])x.classList.add("ok")});if(+t.dataset.k!=q[3])t.classList.add("no");t.parentNode.querySelector(".ex").textContent=q[4]}});
render();
</script></main></body></html>
