<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adobe After Effects Tutor – Motion Design from Zero</title>
<style>
:root{--bg:#0a0a18;--p:#141428;--p2:#1f1f3a;--ink:#ecebff;--mut:#9d9cc4;--ac:#9999ff;--pk:#ff7bd5;--ok:#3ddc97;--bad:#ff6b6b;--gold:#ffb74d;--line:#2c2c4e;box-sizing:border-box}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
header{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 8px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:18px}header b span{background:var(--ac);color:#0a0a18;border-radius:6px;padding:1px 7px;margin-right:6px;font-weight:900}
.xp{background:var(--p2);color:var(--gold);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}
#seg{position:sticky;top:0;z-index:5;display:flex;gap:6px;padding:8px 14px;background:#0a0a18ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
#seg button{flex:1;padding:9px 2px;border-radius:10px;border:1px solid var(--line);background:var(--p);color:var(--mut);font-weight:700;font-size:13px}#seg button.on{background:var(--ac);color:#0a0a18;border-color:var(--ac)}
main{max-width:700px;margin:0 auto;padding:14px 14px 50px}
h2{font-size:21px;margin:8px 0 10px}h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:20px 0 8px}
.hero{background:linear-gradient(120deg,#1b1450,#5b4bd6 60%,#ff7bd5);border-radius:18px;padding:16px}.hero h2{margin:0}.hero p{margin:6px 0 12px;font-size:14px;opacity:.95}
.ruler{position:relative;height:26px;border-radius:8px;background:#00000040;background-image:repeating-linear-gradient(90deg,#ffffff55 0 1px,transparent 1px calc(100%/12));overflow:hidden}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--pk);transition:left .4s}.ph:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--pk)}
.lay{display:block;width:100%;text-align:left;background:var(--p);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:7px 0;color:var(--ink);font-size:15px}
.lt{display:flex;gap:8px;align-items:center}.lt b{flex:1}.lt em{font-style:normal;color:var(--lc);font-weight:900}.lay small{color:var(--mut)}
.tr{display:block;height:8px;border-radius:5px;background:var(--p2);margin-top:7px;overflow:hidden}.tr i{display:block;height:100%;background:var(--lc);border-radius:5px}.lay.done{border-color:var(--ok)}
.back{background:none;border:0;color:var(--ac);font-weight:800;font-size:15px;padding:4px 0}
.bd{display:inline-block;background:var(--lc);color:#0a0a18;font-weight:900;font-size:11px;padding:3px 10px;border-radius:99px}
svg{width:100%;height:auto;border-radius:12px;display:block;margin:10px 0}svg text{font:700 9px system-ui;fill:#ecebff}
.card{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
ol{counter-reset:s;list-style:none;padding:0;margin:8px 0}ol li{counter-increment:s;display:flex;gap:10px;margin:9px 0}ol li:before{content:counter(s);flex:none;width:24px;height:24px;border-radius:6px;background:var(--ac);color:#0a0a18;font-weight:900;font-size:13px;display:grid;place-items:center}
.k{display:inline-block;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;margin:3px 4px 3px 0;font-size:13px}.k b{color:var(--ac);margin-right:4px}
.tip{background:#9999ff1c;border-left:4px solid var(--ac);padding:9px 12px;border-radius:0 12px 12px 0;font-size:14px;margin:12px 0}
.mini{background:#ff7bd51a;border:1.5px dashed var(--pk);border-radius:14px;padding:12px;margin:12px 0}.mini b{color:var(--pk)}
.btn{display:block;width:100%;padding:13px;border-radius:12px;border:0;background:var(--ac);color:#0a0a18;font-weight:900;font-size:15px;margin:8px 0}.btn.o{background:none;border:1.5px solid var(--ac);color:var(--ac)}.btn.ok{background:var(--ok)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.chip{display:inline-block;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font-size:14px;font-weight:700;margin:3px 4px 3px 0}.chip.on{background:var(--ac);color:#0a0a18;border-color:var(--ac)}
#stg{height:120px;background:var(--p);border:1px solid var(--line);border-radius:14px;position:relative;overflow:hidden;margin:8px 0}
#ob{position:absolute;left:6px;top:36px;width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,#9999ff,#ff7bd5)}
input[type=range]{width:100%;accent-color:#9999ff}
.opt{display:block;width:100%;text-align:left;margin:7px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font-size:15px}.opt.good{background:#3ddc9730;border-color:var(--ok)}.opt.bad{background:#ff6b6b30;border-color:var(--bad)}
.it{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0;color:var(--ink);font-size:15px}.it span{font-size:26px}.it small{display:block;color:var(--mut)}
.bar{height:10px;border-radius:6px;background:var(--p2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--pk))}
.kb{padding:8px 0;border-bottom:1px solid var(--line)}.lock{text-align:center;border:1.5px dashed var(--gold);border-radius:16px;padding:22px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,40px);opacity:0;background:var(--gold);color:#2a1c00;font-weight:800;padding:9px 18px;border-radius:99px;transition:.3s;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header><b><span>Ae</span>After Effects Tutor</b><div class="xp" id="xp"></div></header>
<div id="seg"></div><main id="app"></main><div id="toast"></div>
<script>
const FREE=true;
const LV=["Basic","Intermediate","Advanced"],LC=["#3ddc97","#9999ff","#ffb74d"];
const L=[
[0,"Your first composition",10,"After Effects is where pictures, shapes and text turn into motion. Think of a composition as a small movie set: the Project panel is the prop room, the Composition panel is the stage and the Timeline is the schedule that says what appears when.",["Press Ctrl+N to make a composition: 1920 × 1080 px, 30 fps, 10 seconds.","Press Ctrl+I to import a picture or video, then drag it into the Timeline.","Press Space to preview and Space again to stop.","Press Ctrl+S often to save your project."],[["Ctrl+N","New comp"],["Ctrl+I","Import"],["Space","Play / stop"]],"Use 30 fps for social media and 24 fps for a cinema look.","Make a 5-second composition with one photo inside and preview it.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><rect x="6" y="6" width="70" height="86" rx="5" fill="#1f1f3a"/><rect x="82" y="6" width="212" height="86" rx="5" fill="#1f1f3a"/><rect x="6" y="98" width="288" height="46" rx="5" fill="#1f1f3a"/><rect x="130" y="22" width="110" height="56" fill="#9999ff"/><text x="12" y="20">Project</text><text x="88" y="20">Composition</text><text x="12" y="112">Timeline</text><rect x="60" y="120" width="130" height="8" rx="4" fill="#ff7bd5"/></svg>`],
[0,"Layers and the five basic properties",12,"Every layer has a Transform group with five properties: Anchor Point, Position, Scale, Rotation and Opacity. Master these and you can animate almost anything.",["Select a layer and press P to show Position. Drag it on the canvas.","Press S for Scale, R for Rotation and T for Opacity.","Hold Shift and press another key to show several properties together.","Press A for Anchor Point, the pivot a layer rotates around."],[["P","Position"],["S","Scale"],["R","Rotation"],["T","Opacity"],["A","Anchor"]],"If a layer rotates around the wrong point, move its anchor point first.","Place a picture and change its position, scale, rotation and opacity using only shortcut keys.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><rect x="100" y="35" width="100" height="80" fill="#9999ff" opacity=".85"/><circle cx="150" cy="75" r="5" fill="#ff7bd5"/><text x="30" y="40">P Position</text><text x="30" y="60">S Scale</text><text x="30" y="80">R Rotation</text><text x="30" y="100">T Opacity</text><text x="212" y="80" style="fill:#ff7bd5">A = anchor</text></svg>`],
[0,"Keyframes: bring things to life",15,"A keyframe is a saved value at one moment in time. Give a property two keyframes and After Effects fills in the movement between them.",["Move the playhead to 0 s. Click the stopwatch next to Position to make the first keyframe.","Move to 2 s and drag the layer somewhere new. A second keyframe appears.","Press Space to preview the motion.","Press U to show animated properties and J or K to jump between keyframes."],[["U","Show keyframes"],["J / K","Prev / next"],["F9","Easy Ease"]],"Select the keyframes and press F9. Motion feels more natural at once.","Slide a title in from the left while it fades in.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><line x1="30" y1="100" x2="270" y2="100" stroke="#9d9cc4"/><path d="M60 100 l8 -9 l8 9 l-8 9z M220 100 l8 -9 l8 9 l-8 9z" fill="#ffb74d"/><path d="M68 70 Q144 10 228 70" fill="none" stroke="#9999ff" stroke-width="3" stroke-dasharray="5 4"/><circle cx="68" cy="70" r="7" fill="#ff7bd5"/><circle cx="228" cy="70" r="7" fill="#ff7bd5" opacity=".5"/><text x="46" y="128">0 s: keyframe</text><text x="200" y="128">2 s: keyframe</text></svg>`],
[0,"Text and shape layers",15,"Text and shapes are drawn inside After Effects, so they stay sharp at any size. They are the building blocks of titles, logos and lower thirds.",["Press Ctrl+T for the Type tool, click the canvas and type.","Press Q to pick a shape tool and drag. Change Fill and Stroke in the toolbar.","Open Window → Align to line things up neatly.","Press Ctrl+D to duplicate a layer."],[["Ctrl+T","Type tool"],["Q","Shape tool"],["Ctrl+D","Duplicate"]],"Keep to one font family and 2 or 3 colours for a clean, professional look.","Build a lower third: a coloured bar with a name on top.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><rect x="40" y="80" width="180" height="34" rx="4" fill="#9999ff"/><rect x="40" y="80" width="8" height="34" fill="#ff7bd5"/><text x="60" y="96" style="font-size:12px;fill:#0a0a18">YOUR NAME</text><text x="60" y="108" style="fill:#0a0a18">Job title</text><circle cx="250" cy="40" r="22" fill="#ff7bd5"/><text x="226" y="82">Shape layers</text></svg>`],
[1,"Easing and the Graph Editor",18,"Real objects speed up and slow down. The Graph Editor shows speed as a curve, so you can shape the feeling of any movement.",["Select your keyframes and press F9 (Easy Ease).","Open the Graph Editor icon or press Shift+F3.","Drag the handles: a steeper curve means faster movement.","Try an overshoot: let the value pass the end a little, then settle back."],[["F9","Easy Ease"],["Shift+F3","Graph Editor"]],"Slow in, slow out is the secret of smooth professional animation.","Move a ball across the screen with a strong ease-out and a small overshoot.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><path d="M30 120 C 110 120, 150 30, 270 30" fill="none" stroke="#9999ff" stroke-width="4"/><path d="M30 120 L110 120 M150 30 L270 30" stroke="#ff7bd5"/><circle cx="110" cy="120" r="5" fill="#ff7bd5"/><circle cx="150" cy="30" r="5" fill="#ff7bd5"/><text x="40" y="140">Slow start</text><text x="196" y="22">Slow end</text></svg>`],
[1,"Masks and track mattes",18,"A mask shows only part of a layer. A track matte uses one layer to cut another, which is how you reveal text with a moving shape.",["Select a layer, press G for the Pen tool and draw a shape. That shape is a mask.","Press F to show Mask Feather and soften the edge.","Put a shape above your text and set the text Track Matte to Alpha Matte.","Animate the shape to reveal the text."],[["G","Pen tool"],["M","Mask path"],["F","Feather"]],"Rename layers (select, press Enter). Mattes get confusing quickly.","Reveal your name with a wipe made with a track matte.",`<svg viewBox="0 0 300 150"><defs><clipPath id="cp"><rect x="60" y="50" width="100" height="50"/></clipPath></defs><rect width="300" height="150" rx="10" fill="#0f0f22"/><text x="60" y="86" style="font-size:30px;fill:#3a3a66">TITLE</text><g clip-path="url(#cp)"><text x="60" y="86" style="font-size:30px;fill:#9999ff">TITLE</text></g><rect x="60" y="50" width="100" height="50" fill="none" stroke="#ff7bd5" stroke-dasharray="4"/><text x="60" y="124">Only the matte area shows</text></svg>`],
[1,"Effects and presets",15,"Effects change how a layer looks: blur, glow, colour and more. Animation Presets are ready-made motions you can customise.",["Open the Effects and Presets panel and search Gaussian Blur or Glow.","Drag an effect onto a layer and edit it in Effect Controls.","Make an Adjustment Layer (Ctrl+Alt+Y) to affect everything below it.","Search for animation presets and double-click one to apply it."],[["Ctrl+Alt+Y","Adjustment layer"],["E","Show effects"]],"Use effects lightly. One good effect beats five busy ones.","Add a soft glow and a subtle blur to a title and animate the blur from 30 to 0.",`<svg viewBox="0 0 300 150"><defs><filter id="bl"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="300" height="150" rx="10" fill="#0f0f22"/><circle cx="90" cy="72" r="28" fill="#ff7bd5" filter="url(#bl)"/><circle cx="90" cy="72" r="18" fill="#fff"/><circle cx="210" cy="72" r="28" fill="#9999ff"/><text x="62" y="124">Glow</text><text x="176" y="124">No effect</text></svg>`],
[1,"Parenting, nulls and precomposing",20,"Parenting links layers so they move together, like a puppet with strings. Precomposing packs many layers into one, which keeps big projects tidy.",["Use the pick whip in the Parent column to link a child layer to a parent layer.","Create a Null Object (Layer → New → Null Object) and parent several layers to it.","Move or scale the null: all the children follow.","Select layers and press Ctrl+Shift+C to precompose them."],[["Ctrl+Shift+C","Precompose"],["Ctrl+Alt+Shift+Y","Null object"]],"Animating one null is faster than animating ten layers.","Group a logo and its text under one null and animate them as one piece.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><rect x="128" y="20" width="44" height="30" fill="none" stroke="#ffb74d" stroke-dasharray="4"/><text x="132" y="38">NULL</text><path d="M150 50 L70 96 M150 50 L150 96 M150 50 L230 96" stroke="#ff7bd5"/><rect x="40" y="96" width="60" height="30" rx="4" fill="#9999ff"/><rect x="120" y="96" width="60" height="30" rx="4" fill="#9999ff"/><rect x="200" y="96" width="60" height="30" rx="4" fill="#9999ff"/></svg>`],
[2,"Expressions",22,"An expression is a tiny piece of code that controls a property for you. You do not need to be a programmer. Two or three expressions will already save you hours.",["Alt-click (Option-click) the stopwatch of a property to open the expression field.","Type wiggle(2,30) on Position. It shakes 2 times a second by 30 pixels.",`Type loopOut("pingpong") on a keyframed property to repeat the motion forever.`,"Use the pick whip to link one property to another."],[["Alt+click","Stopwatch"]],"Copy and adapt expressions. Even experts reuse them.","Make a floating logo that wiggles slightly and a light that pulses forever.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><path d="M20 90 l12 -22 l12 30 l12 -34 l12 40 l12 -26 l12 30 l12 -36 l12 28 l12 -18 l12 20 l12 -10 l12 8" fill="none" stroke="#9999ff" stroke-width="3"/><rect x="60" y="110" width="180" height="26" rx="6" fill="#1f1f3a"/><text x="80" y="127" style="fill:#3ddc97;font-size:12px">wiggle(2,30)</text></svg>`],
[2,"Motion tracking and stabilizing",22,"Tracking makes text or graphics stick to something that moves in a video. Stabilizing removes camera shake.",["Open Window → Tracker and select your video layer.","Click Track Motion and place the tracker box on a clear, high-contrast point.","Click Analyze forward, then Edit Target and apply it to a text layer or null.","For shaky footage choose Warp Stabilizer."],[["Window","Tracker panel"]],"Pick a point that stays visible and has strong contrast.","Attach a label to a moving object in a short clip.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><path d="M40 110 Q110 30 180 80 T260 50" fill="none" stroke="#9d9cc4" stroke-dasharray="4"/><rect x="164" y="66" width="32" height="28" fill="none" stroke="#ff7bd5" stroke-width="2"/><rect x="180" y="40" width="70" height="18" rx="4" fill="#9999ff"/><text x="188" y="52" style="fill:#0a0a18">LABEL</text><text x="40" y="132">Tracker box follows the point</text></svg>`],
[2,"3D layers, cameras and lights",22,"Turning on the 3D switch gives a layer depth. With a camera you can fly through the scene and create parallax: near things move faster than far things.",["Click the 3D cube switch on your layers.","Choose Layer → New → Camera. Press C to cycle through the camera tools.","Place layers at different Z positions to build depth.","Add a light and turn on shadows for realism."],[["C","Camera tools"]],"Small camera moves feel more cinematic than big spinning ones.","Build a 3-layer parallax scene (sky, hills, foreground) with a slow camera push.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><path d="M100 40 L190 40 L200 90 L90 90Z" fill="#9999ff" opacity=".45"/><path d="M80 56 L200 56 L214 108 L66 108Z" fill="#ff7bd5" opacity=".5"/><path d="M60 76 L214 76 L232 128 L42 128Z" fill="#ffb74d" opacity=".55"/><text x="236" y="40">Far</text><text x="236" y="104">Near</text></svg>`],
[2,"Render and deliver",18,"The last step turns your project into a video file. Choose the format that fits where it will be seen.",["Press Ctrl+M to add the composition to the Render Queue, or send it to Adobe Media Encoder for H.264.","For social media and YouTube choose H.264 MP4.","For more editing in Premiere choose a high-quality format such as ProRes if it is available.","Check the sound, size and frame rate, then render."],[["Ctrl+M","Render queue"]],"Watch the full render once before sending it to a client. Menus may differ slightly by version.","Render a 10-second animation as MP4 at two quality levels and compare the file sizes.",`<svg viewBox="0 0 300 150"><rect width="300" height="150" rx="10" fill="#0f0f22"/><rect x="14" y="50" width="76" height="46" rx="8" fill="#1f1f3a"/><rect x="112" y="50" width="76" height="46" rx="8" fill="#1f1f3a"/><rect x="210" y="50" width="76" height="46" rx="8" fill="#9999ff"/><path d="M92 73h18M190 73h18" stroke="#ff7bd5" stroke-width="3"/><text x="28" y="76">Comp</text><text x="120" y="76">Queue</text><text x="224" y="76" style="fill:#0a0a18">MP4</text></svg>`]
];
const ORD=["Import footage and create a composition","Arrange layers and set the timing","Animate with keyframes","Add effects and fix the easing","Preview with Space","Render and export"];
const KQ=[["Which key shows Position?",["P","S","R","T"]],["Which key shows Opacity?",["T","O","A","U"]],["Which key shows only animated properties?",["U","P","K","J"]],["Easy Ease shortcut?",["F9","F5","F3","F12"]],["Jump to the next keyframe?",["K","J","L","H"]],["Open the Graph Editor?",["Shift+F3","Ctrl+G","Alt+G","F2"]],["Precompose shortcut?",["Ctrl+Shift+C","Ctrl+P","Ctrl+Alt+P","Ctrl+K"]],["New adjustment layer?",["Ctrl+Alt+Y","Ctrl+Y","Ctrl+Shift+Y","Ctrl+Alt+A"]]];
const FX=[["Your animation feels robotic and stiff. What do you try first?",["Add Easy Ease (F9) and adjust the Graph Editor","Raise the frame rate to 120","Add more effects","Change the font"]],["Previewing is slow and jumpy. What helps?",["Lower the preview resolution to Half or Quarter","Add more layers","Delete the composition","Make the text bigger"]],["A layer rotates around the wrong point. What is the fix?",["Move the Anchor Point (A)","Increase the opacity","Add a blur","Lower the frame rate"]]];
const PJ=[["Logo reveal","Reveal your logo with a shape wipe and a soft glow (5 seconds).","Hint: animate a shape over the logo and use it as a track matte."],["Lower third","Animate a name bar that slides in, stays 3 seconds and slides out.","Hint: use Easy Ease on position keyframes. Copy and reverse them for the exit."],["Kinetic text","Make 3 words appear one after another with scale and opacity.","Hint: offset each layer by 5 frames. Press [ to start a layer at the playhead."],["Bouncing ball","Animate a ball with squash and stretch.","Hint: slow at the top of the bounce, fast near the ground, squash Scale Y on impact."],["15-second product promo","Combine a product photo, text, music and a closing call-to-action.","Hint: plan 3 scenes of 5 seconds first, then animate them one by one."]];
const EASE={lin:t=>t,ease:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,over:t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)}};
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let S=JSON.parse(g("ae")||'{"d":[],"p":[],"c":[]}');
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const xp=()=>S.d.length*20+S.p.length*30+S.c.length*50,lk=n=>FREE&&n>0;
let tab="course",cur=null,act=null,ord,kq,fx,LB={p:"pos",e:"ease",d:1.5,t:[]};
function toast(m){const t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",1600)}
function award(k,id,p){if(!S[k].includes(id)){S[k].push(id);sv("ae",JSON.stringify(S));toast("+"+p+" XP ⭐");$("#xp").textContent="⭐ "+xp()+" XP"}}
const lockC='<div class="lock"><h2>🔒 Full version only</h2><p>This lesson or activity is in the paid version (300 ETB).</p></div>';
function course(){const nx=S.d.length,h=`<div class="hero"><h2>Your motion design timeline</h2><p>12 lessons from first composition to final render. The pink playhead moves as you learn.</p><div class="ruler"><div class="ph" style="left:${nx/12*100}%"></div></div><small>${nx} of 12 lessons complete</small></div>`;
 return h+LV.map((n,v)=>`<h3 style="color:${LC[v]}">${n} level</h3>`+L.map((x,i)=>x[0]!=v?"":`<button class="lay ${S.d.includes(i)?"done":""}" style="--lc:${LC[v]}" data-a="open" data-i="${i}"><span class="lt"><em>${i+1}</em><b>${x[1]}</b><span>${S.d.includes(i)?"✔":lk(v)?"🔒":""}</span></span><small>${x[2]} min</small><span class="tr"><i style="width:${x[2]/22*100}%"></i></span></button>`).join("")).join("")}
function lesson(i){const x=L[i],b='<button class="back" data-a="list">← Back to timeline</button>';if(lk(x[0]))return b+lockC;
 return b+`<div style="--lc:${LC[x[0]]}"><span class="bd">${LV[x[0]].toUpperCase()} · ${x[2]} MIN</span></div><h2>${i+1}. ${x[1]}</h2>${x[8]}<p>${x[3]}</p><h3>Key shortcuts</h3><div>${x[5].map(k=>`<span class="k"><b>${k[0]}</b>${k[1]}</span>`).join("")}</div><h3>Step by step</h3><ol>${x[4].map(s=>"<li><span>"+s+"</span></li>").join("")}</ol><div class="tip">💡 <b>Pro tip:</b> ${x[6]}</div><div class="mini"><b>🎬 Mini project</b><br>${x[7]}</div><button class="btn ${S.d.includes(i)?"ok":""}" data-a="done" data-i="${i}">${S.d.includes(i)?"✔ Completed":"I finished this lesson (+20 XP)"}</button><div class="row">${i>0?`<button class="btn o" data-a="open" data-i="${i-1}">← Prev</button>`:""}${i<11?`<button class="btn o" data-a="open" data-i="${i+1}">Next →</button>`:""}</div>`}
function graph(){let d="";for(let i=0;i<=40;i++){const t=i/40;d+=(i?"L":"M")+(10+t*180).toFixed(1)+" "+(86-EASE[LB.e](t)*62).toFixed(1)}return `<svg viewBox="0 0 200 100"><rect width="200" height="100" rx="8" fill="#141428"/><path d="${d}" fill="none" stroke="#9999ff" stroke-width="3"/><path d="M10 86H190M10 24H190" stroke="#2c2c4e"/><rect x="6" y="82" width="8" height="8" fill="#ffb74d" transform="rotate(45 10 86)"/><rect x="186" y="20" width="8" height="8" fill="#ffb74d" transform="rotate(45 190 24)"/><text x="12" y="98">0 s</text><text x="156" y="98">${LB.d} s</text></svg>`}
function lab(){const P=[["pos","Position"],["scl","Scale"],["rot","Rotation"],["opa","Opacity"]],E=[["lin","Linear"],["ease","Easy Ease"],["over","Overshoot"]];
 return `<h2>🎛️ Keyframe Lab</h2><p style="color:var(--mut)">Two keyframes, one animation. Change the property and the easing, press Play and watch how it feels.</p><div id="stg"><div id="ob"></div></div><h3>Property</h3>${P.map(p=>`<button class="chip ${LB.p==p[0]?"on":""}" data-a="lp" data-v="${p[0]}">${p[1]}</button>`).join("")}<h3>Easing</h3>${E.map(p=>`<button class="chip ${LB.e==p[0]?"on":""}" data-a="le" data-v="${p[0]}">${p[1]}${LB.t.includes(p[0])?" ✔":""}</button>`).join("")}<h3>Duration: <span id="dv">${LB.d}</span> s</h3><input type="range" id="dur" min="0.5" max="3" step="0.1" value="${LB.d}"><button class="btn" data-a="play">▶ Play</button><h3>Speed graph</h3>${graph()}<div class="tip">Linear moves at a constant speed, so it feels mechanical. Easy Ease starts and ends slowly. Overshoot goes a little past the end, then settles. Try all three to earn XP.</div>`}
function playTab(){const A=[["order","🧩","Workflow puzzle","Put the 6 steps in the right order."],["kq","⚡","Shortcut speed round","8 questions on key shortcuts."],["fx","🛠️","Fix the problem","3 real problems, find the fix."],["pj","🏆","Mini projects","5 projects with hints."]];
 return '<h2>Play and practise</h2>'+A.map(a=>`<button class="it" data-a="act" data-k="${a[0]}"><span>${a[1]}</span><div><b>${a[2]}</b><small>${a[3]}${FREE&&a[0]!="order"?" · 🔒":""}</small></div></button>`).join("")}
function actv(){const k=act,b='<button class="back" data-a="plist">← Back</button>';if(FREE&&k!="order")return b+lockC;
 if(k=="order"){if(!ord)ord={it:sh([0,1,2,3,4,5]),q:[]};return b+`<h2>🧩 Workflow puzzle</h2><p>Tap the steps in the order a motion designer works.</p>${ord.it.map(i=>`<button class="opt ${ord.q.includes(i)?"good":""}" data-a="ord" data-i="${i}">${ord.q.includes(i)?ord.q.indexOf(i)+1+". ":""}${ORD[i]}</button>`).join("")}${ord.q.length==6?'<div class="tip">🎉 Perfect order! Plan first, polish last.</div><button class="btn" data-a="reset" data-k="ord">Play again</button>':""}`}
 if(k=="kq"){if(!kq)kq={i:0,s:0,o:null};if(kq.i>=8)return b+`<h2>⚡ Score: ${kq.s}/8</h2><div class="tip">${kq.s>=6?"Great! You know your shortcuts.":"Keep practising. Shortcuts make you much faster."}</div><button class="btn" data-a="reset" data-k="kq">Play again</button>`;const q=KQ[kq.i];if(!kq.o)kq.o=sh(q[1]);return b+`<h2>⚡ Question ${kq.i+1}/8</h2><p><b>${q[0]}</b></p>${kq.o.map(o=>`<button class="opt" data-a="kqa" data-v="${o==q[1][0]?1:0}">${o}</button>`).join("")}`}
 if(k=="fx"){if(!fx)fx={i:0,o:null};if(fx.i>=3)return b+'<h2>🛠️ Problems solved!</h2><div class="tip">These three fixes solve most beginner headaches.</div><button class="btn" data-a="reset" data-k="fx">Play again</button>';const q=FX[fx.i];if(!fx.o)fx.o=sh(q[1]);return b+`<h2>🛠️ Problem ${fx.i+1}/3</h2><p><b>${q[0]}</b></p>${fx.o.map(o=>`<button class="opt" data-a="fxa" data-v="${o==q[1][0]?1:0}">${o}</button>`).join("")}`}
 return b+'<h2>🏆 Mini projects</h2>'+PJ.map((c,i)=>`<div class="card"><b>${i+1}. ${c[0]}</b><p>${c[1]}</p><details><summary style="color:var(--ac)">Need a hint?</summary><p>${c[2]}</p></details><button class="btn ${S.c.includes(i)?"ok":"o"}" data-a="cd" data-i="${i}">${S.c.includes(i)?"✔ Done":"I made it (+50 XP)"}</button></div>`).join("")}
function me(){const p=xp(),n=p<100?"Beginner":p<250?"Animator":p<450?"Motion Designer":"Pro Editor",nx=p<100?100:p<250?250:p<450?450:610,d=v=>L.filter((x,i)=>x[0]==v&&S.d.includes(i)).length,B=[["🌱","First lesson",S.d.length>0],["🟢","Basic complete",d(0)==4],["🟣","Intermediate complete",d(1)==4],["🟠","Advanced complete",d(2)==4],["🎛️","Keyframe Lab master",S.p.includes("lab")],["🧠","Puzzle master",["order","kq","fx"].every(x=>S.p.includes(x))],["🎬","3 mini projects",S.c.length>=3]];
 return `<h2>My progress</h2><div class="card"><b style="font-size:22px">${n}</b><p style="color:var(--mut);margin:4px 0 8px">${p} XP · next goal ${nx}</p><div class="bar"><i style="width:${Math.min(100,p/nx*100)}%"></i></div></div><h3>Badges</h3><div class="card">${B.map(b=>`<div class="kb" style="opacity:${b[2]?1:.35}"><span style="font-size:22px">${b[0]}</span> ${b[1]}</div>`).join("")}</div><button class="btn o" data-a="wipe">Reset my progress</button>`}
function render(){$("#xp").textContent="⭐ "+xp()+" XP";$("#seg").innerHTML=[["course","🎞️ Course"],["lab","🎛️ Lab"],["play","🎮 Play"],["me","🏅 Me"]].map(n=>`<button class="${tab==n[0]?"on":""}" data-t="${n[0]}">${n[1]}</button>`).join("");
 $("#app").innerHTML=tab=="course"?(cur!==null?lesson(cur):course()):tab=="lab"?lab():tab=="play"?(act?actv():playTab()):me();scrollTo(0,0)}
function ap(o,p,W){const k=LB.p;o.style.transform=k=="pos"?`translateX(${p*W}px)`:k=="scl"?`scale(${.5+p})`:k=="rot"?`rotate(${p*360}deg)`:"none";o.style.opacity=k=="opa"?.1+.9*p:1}
function anim(){const o=$("#ob"),W=$("#stg").clientWidth-72,f=EASE[LB.e],t0=performance.now(),D=LB.d*1000;(function fr(n){const t=Math.min(1,(n-t0)/D);ap(o,f(t),W);if(t<1)requestAnimationFrame(fr)})(t0);if(!LB.t.includes(LB.e)){LB.t.push(LB.e);if(LB.t.length==3)award("p","lab",30)}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(D.t){tab=D.t;cur=null;act=null;return render()}
 switch(D.a){case"open":cur=+D.i;render();break;case"list":cur=null;render();break;
 case"done":{const i=+D.i;if(lk(L[i][0]))return;award("d",i,20);render();scrollTo(0,document.body.scrollHeight);break}
 case"lp":LB.p=D.v;render();break;case"le":LB.e=D.v;render();break;case"play":anim();break;
 case"act":act=D.k;render();break;case"plist":act=null;ord=kq=fx=null;render();break;
 case"ord":{const i=+D.i;if(ord.q.includes(i))return;if(i==ord.q.length){ord.q.push(i);if(ord.q.length==6)award("p","order",30);render()}else{t.classList.add("bad");toast("Not yet. What comes first?");setTimeout(()=>t.classList.remove("bad"),500)}break}
 case"kqa":if(D.v=="1")kq.s++;kq.i++;kq.o=null;if(kq.i>=8&&kq.s>=6)award("p","kq",30);render();break;
 case"fxa":if(D.v=="1"){fx.i++;fx.o=null;if(fx.i>=3)award("p","fx",30);render()}else{t.classList.add("bad");toast("Think again")}break;
 case"reset":if(D.k=="ord")ord=null;if(D.k=="kq")kq=null;if(D.k=="fx")fx=null;render();break;
 case"cd":{const i=+D.i;if(S.c.includes(i)){S.c=S.c.filter(x=>x!=i);sv("ae",JSON.stringify(S))}else award("c",i,50);render();break}
 case"wipe":if(confirm("Reset all progress?")){S={d:[],p:[],c:[]};sv("ae",JSON.stringify(S));render()}}});
document.addEventListener("input",e=>{if(e.target.id=="dur"){LB.d=+e.target.value;$("#dv").textContent=LB.d}});
render();
</script></body></html>
