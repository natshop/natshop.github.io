const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let S=Object.assign({done:[],q:{},ex:0,nm:"",notes:{},last:0},JSON.parse(g("gd")||"{}"));const save=()=>sv("gd",JSON.stringify(S));
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
let v="home",cur=0,exm=null;
if(g("gdz"))document.body.classList.add(g("gdz"));
function drawer(){$("#dc").innerHTML=`<h2 style="margin-top:0">Chapters</h2><button data-a="home">🏠 Home</button>${CH.map((c,i)=>`<button data-a="ch" data-i="${i}">${S.done.includes(i)?"✔":c[0]} ${i+1}. ${c[1]}</button>`).join("")}<button data-a="gl">📖 Glossary</button><button data-a="exam">📝 Final exam</button>${S.ex?'<button data-a="cert">🏆 My certificate</button>':""}`}
function home(){const p=Math.round(S.done.length/CH.length*100);return `<div class="hero"><h1>Graphic Design: the Full Course</h1><p>10 chapters of clear notes, pictures, key terms, practice tasks and quizzes. Completely free, with a certificate when you pass the final exam.</p><div class="bar"><i style="width:${p}%"></i></div><p style="margin:.4em 0 0;font-size:.85rem">${S.done.length} of 10 chapters complete</p></div><button class="btn" data-a="ch" data-i="${Math.min(S.last,9)}">${S.done.length?"Continue learning":"Start chapter 1"}</button><h3>All chapters</h3>${CH.map((c,i)=>`<button class="ch ${S.done.includes(i)?"done":""}" data-a="ch" data-i="${i}"><span class="n">${S.done.includes(i)?"✔":c[0]}</span><span><b>${i+1}. ${c[1]}</b><small>${c[2]} min read · 3 quiz questions</small></span></button>`).join("")}<button class="ch" data-a="gl"><span class="n">📖</span><span><b>Glossary</b><small>Search all 50 key terms</small></span></button><button class="ch" data-a="exam"><span class="n">📝</span><span><b>Final exam and certificate</b><small>15 questions · pass with 70%</small></span></button>`}
function chap(i){const c=CH[i];S.last=i;save();return `<h3>Chapter ${i+1} of 10 · ${c[2]} min</h3><h1>${c[0]} ${c[1]}</h1><div class="goals"><b>You will learn to:</b><ul>${c[3].map(x=>"<li>"+x+"</li>").join("")}</ul></div>${c[9]}${c[4].map(s=>`<h2>${s[0]}</h2><p>${s[1]}</p>`).join("")}<h3>Key terms</h3>${c[5].map(t=>`<span class="term"><b>${t[0]}:</b> ${t[1]}</span>`).join("")}<div class="tip">💡 <b>Pro tip:</b> ${c[6]}</div><div class="task">🎯 <b>Practice task</b><br>${c[7]}</div><h3>Check yourself</h3>${c[8].map((q,j)=>qz(i,j,q)).join("")}<h3>My notes</h3><textarea id="nt" rows="4" placeholder="Write your own notes here. They are saved on this device.">${S.notes[i]||""}</textarea><button class="btn ${S.done.includes(i)?"ok":""}" data-a="done" data-i="${i}">${S.done.includes(i)?"✔ Chapter complete":"Mark chapter complete"}</button><div class="row">${i>0?`<button class="btn o" data-a="ch" data-i="${i-1}">← Previous</button>`:""}${i<9?`<button class="btn o" data-a="ch" data-i="${i+1}">Next →</button>`:`<button class="btn o" data-a="exam">Final exam →</button>`}</div>`}
function qz(i,j,q){const k=i+"-"+j,a=S.q[k];return `<div class="q"><b>${q[0]}</b>${q[1].map((o,n)=>`<button class="o ${a!==undefined?(n==q[2]?"g":n==a?"b":""):""}" data-a="qa" data-c="${i}" data-j="${j}" data-n="${n}" ${a!==undefined?"disabled":""}>${o}</button>`).join("")}${a!==undefined?`<div class="ex">${a==q[2]?"✔ Correct. ":"✘ Not quite. "}${q[3]}</div>`:""}</div>`}
function gl(q=""){const all=CH.flatMap((c,i)=>c[5].map(t=>[t[0],t[1],i+1])).sort((a,b)=>a[0].localeCompare(b[0])),f=all.filter(t=>(t[0]+t[1]).toLowerCase().includes(q.toLowerCase()));return `<h1>📖 Glossary</h1><input id="gq" placeholder="Search a term…" value="${q}"><div style="margin-top:12px">${f.map(t=>`<div class="q"><b>${t[0]}</b> <small class="ui" style="color:var(--mut)">· chapter ${t[2]}</small><br>${t[1]}</div>`).join("")||"<p>No match.</p>"}</div>`}
function exam(){if(!exm){const all=CH.flatMap(c=>c[8]);exm={q:sh(all).slice(0,15).map(q=>({q:q,o:sh(q[1].map((x,i)=>[x,i]))})),i:0,s:0,w:[]}}
 if(exm.i>=15){const p=Math.round(exm.s/15*100),ok=p>=70;if(ok){S.ex=Math.max(S.ex,p);save()}return `<h1>${ok?"🎉 You passed!":"Almost there"}</h1><div class="q"><b style="font-size:1.6rem">${exm.s} / 15 (${p}%)</b><p>${ok?"Great work. Your certificate is ready.":"You need 70% to pass. Read the chapters you missed and try again."}</p></div>${ok?'<button class="btn" data-a="cert">View my certificate</button>':""}<button class="btn o" data-a="rexam">Try the exam again</button>`}
 const x=exm.q[exm.i];return `<h3>Final exam · question ${exm.i+1} of 15</h3><div class="bar" style="background:var(--line)"><i style="background:var(--ac);width:${exm.i/15*100}%"></i></div><div class="q"><b>${x.q[0]}</b>${x.o.map(o=>`<button class="o" data-a="ea" data-r="${o[1]==x.q[2]?1:0}">${o[0]}</button>`).join("")}<div id="ee"></div></div>`}
function cert(){const d=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});return `<div class="np"><h1>🏆 My certificate</h1><p class="ui">Type your name exactly as you want it printed.</p><input id="cn" placeholder="Your full name" value="${S.nm}"></div><div class="cert" id="cc"><h1>Certificate of Completion</h1><p>This certifies that</p><div class="nm" id="cnm">${S.nm||"Your Name"}</div><p>has completed the course<br><b>Graphic Design: the Full Course</b><br>with a final exam score of ${S.ex}%</p><p style="margin-top:20px">${d}<br><small>Nati Tutors · natshop.github.io</small></p></div><button class="btn np" onclick="window.print()">🖨️ Print or save as PDF</button>`}
function render(){drawer();const a=$("#app");a.innerHTML=v=="home"?home():v=="ch"?chap(cur):v=="gl"?gl():v=="exam"?exam():cert();scrollTo(0,0)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(t.id=="mb")return $("#dr").classList.add("on");if(t.id=="fm"){document.body.className="small";sv("gdz","small");return}if(t.id=="fp"){document.body.className="big";sv("gdz","big");return}
 if(D.a){$("#dr").classList.remove("on");
  if(D.a=="home"){v="home";render()}else if(D.a=="ch"){v="ch";cur=+D.i;render()}else if(D.a=="gl"){v="gl";render()}else if(D.a=="exam"){v="exam";exm=null;render()}else if(D.a=="rexam"){exm=null;render()}else if(D.a=="cert"){v="cert";render()}
  else if(D.a=="done"){const i=+D.i;if(!S.done.includes(i))S.done.push(i);save();v=i<9?"ch":"home";if(i<9){cur=i+1}render()}
  else if(D.a=="qa"){S.q[D.c+"-"+D.j]=+D.n;save();const y=window.scrollY;render();scrollTo(0,y)}
  else if(D.a=="ea"){const ok=D.r=="1";if(ok)exm.s++;const b=t.parentNode.querySelectorAll(".o");b.forEach(x=>x.disabled=true);t.classList.add(ok?"g":"b");if(!ok)b.forEach(x=>{if(x.dataset.r=="1")x.classList.add("g")});$("#ee").innerHTML=`<div class="ex">${ok?"✔ Correct":"✘ Not quite"}: ${exm.q[exm.i].q[3]}</div><button class="btn" data-a="en">${exm.i>=14?"See result":"Next question"}</button>`}
  else if(D.a=="en"){exm.i++;render()}}});
$("#dr").addEventListener("click",e=>{if(e.target.id=="dr")$("#dr").classList.remove("on")});
document.addEventListener("input",e=>{const el=e.target;
 if(el.id=="nt"){S.notes[cur]=el.value;save()}
 if(el.id=="gq"){$("#app").innerHTML=gl(el.value);const q=$("#gq");q.focus();q.setSelectionRange(99,99)}
 if(el.id=="cn"){S.nm=el.value;save();$("#cnm").textContent=el.value||"Your Name"}});
addEventListener("scroll",()=>{const h=document.documentElement,m=h.scrollHeight-h.clientHeight;$("#rp").style.width=(m>0?h.scrollTop/m*100:0)+"%"},{passive:true});
render();
</script></body></html>
