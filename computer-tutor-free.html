<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basic Computer Tutor – Windows, Word, Excel, PowerPoint, Internet</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2233;--mut:#667089;--line:#e3e7f1;--ac:#5b5bd6;--ok:#1e9e5a;--bad:#d64545;--gold:#f5a524;--sh:0 4px 14px #1c22331a;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--card:#1a1f2d;--ink:#eef1fa;--mut:#9aa4bd;--line:#2a3144;--sh:0 4px 14px #0006}}
*{box-sizing:border-box}html{font-size:16px}body.big{font-size:20px}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--card);box-shadow:var(--sh)}
header b{flex:1;font-size:1.1rem}header button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 10px;font-weight:700}
.xp{background:#f5a52422;color:var(--gold);border-radius:99px;padding:5px 12px;font-weight:800;font-size:.85rem}
main{max-width:700px;margin:0 auto;padding:14px 14px 96px}
h2{margin:6px 0 10px;font-size:1.3rem}h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.hi{background:linear-gradient(135deg,#5b5bd6,#00b4d8);color:#fff;border-radius:20px;padding:18px;box-shadow:var(--sh)}.hi h2{margin:0}.hi p{margin:6px 0 10px;opacity:.95}
.pb{height:10px;background:#ffffff40;border-radius:6px;overflow:hidden}.pb i{display:block;height:100%;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:0;border-radius:20px;padding:16px 12px;box-shadow:var(--sh);text-align:center;color:var(--ink);border-bottom:5px solid var(--c)}
.tile span{display:block;font-size:2.2rem}.tile b{display:block;font-size:1rem}.tile small{color:var(--mut)}
.back{background:none;border:0;color:var(--ac);font-weight:800;font-size:1rem;padding:6px 0}
.chips{display:flex;gap:8px;margin:10px 0}.chip{flex:1;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;font-size:.85rem}.chip small{display:block;font-weight:500;color:var(--mut);font-size:.7rem}.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin:12px 0}
svg{width:100%;height:auto;border-radius:14px;display:block;margin:6px 0 10px}svg text{font:700 9px system-ui;fill:#1c2233}
ol{counter-reset:s;list-style:none;padding:0;margin:8px 0}ol li{counter-increment:s;display:flex;gap:10px;margin:9px 0}ol li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:.85rem;display:grid;place-items:center}
.ex{background:#00b4d818;border-left:5px solid #00b4d8;padding:10px 12px;border-radius:0 14px 14px 0;margin:12px 0}
.ch{background:#f5a52420;border:2px dashed var(--gold);padding:10px 12px;border-radius:14px;margin:12px 0}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:0;background:var(--c,var(--ac));color:#fff;font-weight:800;font-size:1rem;margin:8px 0}.btn.o{background:none;border:2px solid var(--c,var(--ac));color:var(--c,var(--ac))}.btn.ok{background:var(--ok)}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--sh);color:var(--ink);font-size:1rem}.item span{font-size:1.8rem}.item small{display:block;color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}.opt.good{border-color:var(--ok);background:#1e9e5a22}.opt.bad{border-color:var(--bad);background:#d6454522}
input,textarea{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin:6px 0}
table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border:1px solid var(--line);padding:7px 10px;text-align:left}th{background:#1e9e5a22}
.tt{font:1.1rem/1.7 ui-monospace,monospace;background:var(--card);padding:12px;border-radius:12px;margin:8px 0}.tt .g{color:var(--ok)}.tt .r{color:var(--bad);text-decoration:underline}.tt .n{color:var(--mut)}
.meter{height:14px;background:var(--line);border-radius:8px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;transition:.3s}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);box-shadow:0 -4px 14px #0002;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 7px;font-weight:700;font-size:.72rem}nav button i{display:block;font-style:normal;font-size:1.4rem}nav button.on{color:var(--ac)}
.lock{text-align:center;border:2px dashed var(--gold);border-radius:16px;padding:22px;margin:12px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,40px);opacity:0;background:var(--gold);color:#2a1c00;font-weight:800;padding:9px 18px;border-radius:99px;transition:.3s;z-index:9}#toast.on{opacity:1;transform:translate(-50%,0)}
</style></head><body>
<header><b>💻 Computer Tutor</b><button id="big" aria-label="Bigger text">A+</button><span class="xp" id="xp"></span></header>

<script>
const FREE=true;
const LV=["Junior","Intermediate","Advanced"],AGE=["Kids and first-timers","Students and office","Professional skills"];
const SUB=[["🖥️","Computer basics","#6c5ce7",`<svg viewBox="0 0 300 130"><rect width="300" height="130" rx="12" fill="#e9e6ff"/><rect x="80" y="14" width="110" height="72" rx="6" fill="#1c2233"/><rect x="86" y="20" width="98" height="60" fill="#6c5ce7"/><rect x="120" y="86" width="30" height="10" fill="#8a8fa8"/><rect x="70" y="100" width="130" height="16" rx="4" fill="#fff" stroke="#8a8fa8"/><ellipse cx="228" cy="104" rx="11" ry="14" fill="#fff" stroke="#8a8fa8"/><text x="100" y="54" style="fill:#fff">Monitor</text><text x="104" y="125">Keyboard</text><text x="212" y="128">Mouse</text></svg>`],
["📁","Windows and files","#00a8a8",`<svg viewBox="0 0 300 130"><rect width="300" height="130" rx="12" fill="#d9f4f4"/><path d="M30 30h50l8 10h60v28H30z" fill="#f5a524"/><path d="M30 50h118v54H30z" fill="#ffc94d"/><text x="46" y="82">My Work</text><path d="M148 78H190" stroke="#1c2233" stroke-dasharray="3"/><rect x="196" y="50" width="26" height="32" fill="#fff" stroke="#1c2233"/><rect x="232" y="50" width="26" height="32" fill="#fff" stroke="#1c2233"/><text x="192" y="100">Files go inside</text></svg>`],
["📝","Microsoft Word","#2b6cb0",`<svg viewBox="0 0 300 130"><rect width="300" height="130" rx="12" fill="#dbe9fb"/><rect x="95" y="8" width="110" height="116" fill="#fff" stroke="#2b6cb0"/><rect x="108" y="22" width="60" height="10" fill="#2b6cb0"/><g fill="#9db6d6"><rect x="108" y="42" width="84" height="5"/><rect x="108" y="54" width="84" height="5"/><rect x="108" y="66" width="70" height="5"/></g><g fill="#2b6cb0"><circle cx="112" cy="86" r="3"/><circle cx="112" cy="98" r="3"/></g><text x="12" y="30">Heading</text><text x="212" y="70">Body text</text><text x="212" y="92">Bullets</text></svg>`],
["📊","Microsoft Excel","#1e8e4f",`<svg viewBox="0 0 300 130"><rect width="300" height="130" rx="12" fill="#dcf3e5"/><g fill="#fff" stroke="#1e8e4f"><rect x="50" y="20" width="60" height="22"/><rect x="110" y="20" width="60" height="22"/><rect x="50" y="42" width="60" height="22"/><rect x="110" y="42" width="60" height="22"/><rect x="50" y="64" width="60" height="22"/><rect x="110" y="64" width="60" height="22"/></g><rect x="110" y="86" width="60" height="22" fill="#1e8e4f"/><text x="60" y="35">Rice</text><text x="124" y="35">80</text><text x="60" y="57">Oil</text><text x="124" y="57">120</text><text x="60" y="79">Tea</text><text x="124" y="79">45</text><text x="116" y="101" style="fill:#fff">=SUM()</text><text x="186" y="97">Total: 245</text></svg>`],
["🎞️","PowerPoint","#d24726",`<svg viewBox="0 0 300 130"><rect width="300" height="130" rx="12" fill="#fde3dc"/><rect x="70" y="12" width="160" height="90" fill="#fff" stroke="#d24726"/><rect x="82" y="24" width="90" height="12" fill="#d24726"/><rect x="82" y="46" width="50" height="46" fill="#f5a524"/><g fill="#c9a89f"><rect x="142" y="48" width="70" height="5"/><rect x="142" y="60" width="70" height="5"/><rect x="142" y="72" width="54" height="5"/></g><text x="100" y="120">One idea per slide</text></svg>`],
["🌐","Internet and safety","#e67e22",`<svg viewBox="0 0 300 130"><rect width="300" height="130" rx="12" fill="#fdebd9"/><rect x="40" y="14" width="220" height="100" rx="8" fill="#fff" stroke="#e67e22"/><rect x="40" y="14" width="220" height="22" rx="8" fill="#e67e22"/><rect x="70" y="19" width="150" height="12" rx="6" fill="#fff"/><text x="76" y="28">🔒 https://school.edu.et</text><circle cx="150" cy="76" r="22" fill="#fdebd9" stroke="#e67e22"/><path d="M128 76h44M150 54v44" stroke="#e67e22"/><text x="72" y="108">Check the lock and address</text></svg>`]];
const L=[
[0,0,"Meet your computer","A computer is a very fast helper that follows your instructions. You give instructions with the keyboard and the mouse, and it shows results on the screen.",["Press the power button and wait for the desktop.","Move the mouse. Click once to select, double-click to open.","Find Space, Enter and Backspace on the keyboard.","To finish, click Start → Power → Shut down."],"In a school computer lab: the screen is what you look at, the keyboard is like a typewriter and the mouse is your pointing finger.","Open Notepad. Type your name and your favourite food on two lines."],
[0,1,"Hardware, software and storage","Hardware is what you can touch. Software is the programs inside. Memory comes in two kinds: RAM is short-term working space and the SSD or hard drive is long-term storage.",["Right-click Start → System to see RAM and processor.","Open File Explorer → This PC to see free storage.","Install programs only from official websites or the Microsoft Store.","Restart once a week to keep it fast."],"RAM is your desk and the SSD is the filing cabinet. A bigger desk lets you work on more things at once.","Find how much free storage your computer has and write it down."],
[0,2,"Keep your computer healthy","A healthy computer needs updates, protection and backups. Most lost work comes from missing backups, not from difficult problems.",["Install updates in Settings → Windows Update.","Run a scan with Windows Security.","Back up with the 3-2-1 idea: 3 copies, 2 kinds of storage, 1 kept away from home.","If it is slow, close extra programs in Task Manager (Ctrl+Shift+Esc)."],"A final-year student loses a project because the laptop failed. One weekly copy on a flash disk would have saved months.","Copy one important folder to a flash disk or cloud drive."],
[1,0,"Files and folders","A file is one document, picture or song. A folder is a box that holds files. Good folders save you hours of searching.",["Press Windows key + E to open File Explorer.","Right-click empty space → New → Folder and name it.","Drag a file into the folder.","Right-click a file to Rename, Copy or Delete."],"Folders are like school bags: one for Maths, one for English, one for Science.","Create a folder My Work with three folders inside: Documents, Pictures, Music."],
[1,1,"Find, copy and organise fast","Shortcuts and good names make you faster than clicking everywhere. Ctrl is the key to remember.",["Select all with Ctrl+A.","Copy with Ctrl+C, paste with Ctrl+V, cut with Ctrl+X.","Search by name with the box in File Explorer.","Deleted by mistake? Open the Recycle Bin and choose Restore."],"Copy your photos to a flash disk before a long trip.","Name 5 files clearly, like 2026-11-Report-Final, and sort them by Name."],
[1,2,"Windows power skills","These small tricks save minutes every day and make you look like a pro.",["Switch programs with Alt+Tab.","Snap two windows side by side with Windows key + Left or Right.","Take a screenshot with Windows key + Shift + S.","Turn on clipboard history with Windows key + V."],"Compare two documents side by side while writing a report.","Take a screenshot of your desktop and save it in a folder named Screenshots."],
[2,0,"Type and save your first document","Word is for letters, reports, CVs and assignments. The most important habit: save early and often.",["Open Word → Blank document.","Type a few lines. Backspace deletes to the left and Delete to the right.","Save with Ctrl+S, choose a name and a folder.","Press Ctrl+P to see how it will print."],"A short letter to a friend, or a class announcement.","Write 5 sentences about your school or work and save the file as My First Document."],
[2,1,"Make it look professional","Formatting guides the reader. Use styles instead of changing fonts by hand, and your document stays tidy.",["Select text and press Ctrl+B for bold, Ctrl+I for italic, Ctrl+U for underline.","Use Home → Styles → Heading 1 for titles.","Use bullets and numbering for lists.","Insert → Table and Insert → Pictures to add more."],"A CV: your name as Heading 1, sections as Heading 2, skills as bullets.","Create a one-page CV with a heading, three sections and a bullet list."],
[2,2,"Reports, page numbers and contents","Long documents need structure. Word can build the table of contents for you, in seconds, if you used headings.",["Use Heading 1 for chapters and Heading 2 for sections.","Insert → Page Number.","References → Table of Contents → Automatic.","Review → Spelling and Grammar, then Track Changes for feedback."],"A 10-page college assignment with a cover, contents and references.","Make a 3-page report with an automatic table of contents and page numbers."],
[3,0,"Cells, rows and columns","Excel is a giant grid. Columns are letters and rows are numbers, so cell B3 means column B, row 3. Excel does the maths for you.",["Click a cell and type. Enter moves down and Tab moves right.","Type =2+3 and press Enter. Formulas always start with =.","Drag the small square (fill handle) to copy down.","Make the top row bold to show headings."],"A school timetable or a small shop price list.","Type 5 items with prices and add them with =SUM()."],
[3,1,"Formulas that save hours","A few formulas do most of the work: SUM, AVERAGE, MAX, MIN and IF.",["=SUM(B2:B6) adds a range. AVERAGE, MAX and MIN work the same way.",`=IF(B2>=50,"Pass","Fail") makes a decision.`,"Select data and press Ctrl+T to make a table with filters.","Use the Home tab to format as currency or percent."],"Marks for 20 students: total, average and Pass or Fail in one minute.","Enter marks for 5 students and calculate total, average and Pass or Fail."],
[3,2,"Analyse and present data","Excel can answer questions about thousands of rows. These tools turn raw numbers into decisions.",["VLOOKUP, or XLOOKUP in newer Excel, finds a price from a product name.","Insert → PivotTable summarises large data in a few clicks.","Insert → Chart turns numbers into a picture.","Data Validation makes drop-down lists. Conditional Formatting colours important cells."],"A shop owner finds the best-selling product of the month with a PivotTable and a bar chart.","Build a monthly expense sheet with a category drop-down and a pie chart."],
[4,0,"Your first slide show","A presentation helps people follow your ideas. Start simple: a title, a few words and a picture.",["Open PowerPoint → Blank Presentation.","Click Title and type. Add a slide with Ctrl+M.","Choose a Design theme.","Press F5 to present and Esc to stop."],"A 3-slide talk: About me, My family, My dream.","Make 3 slides about your favourite hobby."],
[4,1,"Clear, beautiful slides","People read slides while you speak, so less text works better. One idea per slide.",["Keep to 6 short lines and text 24 pt or bigger.","Insert pictures and align them with Arrange → Align.","Use simple transitions. Animate only to explain something.","Use View → Slide Master to put the same logo on every slide."],"A business pitch where each slide has one big number or one big picture.","Turn one text-heavy slide into a picture and 3 short bullets."],
[4,2,"Present like a pro","Confidence comes from practice. PowerPoint has tools to help you rehearse and to keep notes private.",["Add speaker notes under each slide.","Open Slide Show → Presenter View to see notes while the audience sees slides.","Use Slide Show → Rehearse Timings.","Share with File → Export → PDF or video."],"A graduation project defence: 10 slides in 8 minutes.","Make a 5-slide presentation with speaker notes and rehearse it twice."],
[5,0,"Browsing safely","The internet is a huge library, and not everything in it is true or safe. Learn to ask: who wrote this, and can I trust it?",["Open a browser and type the website address in the top bar.","Search with clear words. Look for the lock icon near the address.","Ask a trusted adult before sharing personal information.","Never click pop-ups that say You won a prize."],"Searching for a map of Ethiopia for school and choosing a trusted website.","Search a topic and find 3 websites. Which is the most trustworthy, and why?"],
[5,1,"Email and online manners","Email is the language of work and school. A clear message gets a quick answer.",["Create an email with a strong password and a recovery phone number.","Write a clear subject. Greet, explain in 3 short lines, say thanks.","Attach files with the paperclip and check the size.","Use Reply all only when everyone needs the answer."],"A job email: Application for Graphic Designer – Your Name.","Email a teacher to ask for a meeting and attach a file."],
[5,2,"Passwords, scams and privacy","Most hacks begin with a person, not a computer. Scammers create urgency, ask for money or codes, and send strange links.",["Use passwords of 12+ characters, or three random words. Never reuse them.","Turn on two-step verification for email and social media.","Check the sender address. Real banks never ask for your PIN or code.","Use a password manager, or keep a safe written backup at home."],"A message says Your account closes in 1 hour, click here. That is a scam.","Test a similar password in the Password lab, then turn on two-step verification on one account."]
];
const TY=["The quick brown fox jumps over the lazy dog.","Practice makes perfect, so type a little every day.","Computers help us learn, work and share ideas."];
const XL=[["Total price: write a formula for the total of B2:B5",/^=(SUM\(B2:B5\)|B2\+B3\+B4\+B5)$/i,"260","Use =SUM and a range."],["Average price of B2:B5",/^=AVERAGE\(B2:B5\)$/i,"65","Use =AVERAGE(...)."],["Most expensive price",/^=MAX\(B2:B5\)$/i,"120","Use =MAX(...)."],["How many items are in A2:A5?",/^=(COUNTA\(A2:A5\)|COUNT\(B2:B5\))$/i,"4","Use =COUNTA(...) for text."],["If Oil (B3) is above 100, show Expensive, else Cheap",/^=IF\(B3>100,"Expensive","Cheap"\)$/i,"Expensive","=IF(test,yes,no) with quotes around text."]];
const PH=[["Dear customer, your bank account closes in 1 hour. Click http://bank-secure-login.xyz and enter your PIN.",1,"Urgent time limit, strange link and a PIN request. Banks never do this."],["Hi class, here are today’s notes. See you tomorrow. – Mr Abebe (from the school email)",0,"Expected message from a known sender with no request for money or codes."],["Congratulations! You won 50,000 birr. Send 500 birr to receive your prize.",1,"Real prizes never ask you to pay first."],["Your friend writes: please send me the code you just received, it is urgent!",1,"Friends’ accounts get hacked. Never share codes. Call your friend."],["Your library book is due Friday. Renew at the desk or on the official website.",0,"Normal reminder. It asks you to use the official place."]];
const SQ=[["Copy",["Ctrl+C","Ctrl+V","Ctrl+X","Ctrl+Z"],0],["Paste",["Ctrl+X","Ctrl+V","Ctrl+S","Ctrl+A"],1],["Undo",["Ctrl+Y","Ctrl+P","Ctrl+Z","Ctrl+B"],2],["Save",["Ctrl+S","Ctrl+N","Ctrl+O","Ctrl+F"],0],["Select all",["Ctrl+L","Ctrl+A","Ctrl+E","Ctrl+K"],1],["Switch program",["Alt+F4","Ctrl+Tab","Alt+Tab","Win+L"],2]];
const LABS=[["ty","⌨️","Typing test","Check your speed and accuracy"],["pw","🔐","Password lab","See how strong a password is"],["xl","📊","Excel challenge","Type 5 real formulas"],["ph","🎣","Scam or safe?","Spot the 5 messages"],["sq","⚡","Shortcut quiz","6 quick questions"]];
const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}},sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let S=JSON.parse(g("pc")||'{"d":[],"l":[]}');if(g("pcbig")=="1")document.body.classList.add("big");
const $=s=>document.querySelector(s);let tab="home",sb=null,lv=0,lab=null,st={};
const xp=()=>S.d.length*20+S.l.length*30,lk=n=>FREE&&n>0;
function toast(m){const t=$("#toast");t.textContent=m;t.className="on";clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",1700)}
function win(k,id,p){if(!S[k].includes(id)){S[k].push(id);sv("pc",JSON.stringify(S));toast("+"+p+" XP ⭐");$("#xp").textContent="⭐ "+xp()}}
const lockC='<div class="lock"><h2>🔒 Full version only</h2><p>This lesson or lab is in the paid version (300 ETB).</p></div>';
const li=(s,l)=>L.findIndex(x=>x[0]==s&&x[1]==l);
function home(){const t=Math.round(S.d.length/L.length*100);return `<div class="hi"><h2>Welcome! 👋</h2><p>Learn computers step by step. Pick a subject. Every one has three levels, from Junior to Advanced.</p><div class="pb"><i style="width:${t}%"></i></div><small>${S.d.length} of ${L.length} lessons done</small></div><div class="grid">${SUB.map((s,i)=>`<button class="tile" style="--c:${s[2]}" data-a="sub" data-i="${i}"><span>${s[0]}</span><b>${s[1]}</b><small>${L.filter((x,k)=>x[0]==i&&S.d.includes(k)).length}/3 lessons</small></button>`).join("")}</div>`}
function subj(){const s=SUB[sb],i=li(sb,lv),x=L[i];let h=`<button class="back" data-a="home">← All subjects</button><div style="--c:${s[2]}">${s[3]}<h2>${s[0]} ${s[1]}</h2><div class="chips">${LV.map((n,k)=>`<button class="chip ${k==lv?"on":""}" data-a="lv" data-i="${k}">${lk(k)?"🔒 ":""}${n}<small>${AGE[k]}</small></button>`).join("")}</div>`;
 if(lk(lv))return h+lockC+"</div>";
 return h+`<div class="card"><b style="color:var(--c)">${LV[lv].toUpperCase()} LEVEL</b><h2>${x[2]}</h2><p>${x[3]}</p><h3>Step by step</h3><ol>${x[4].map(z=>"<li><span>"+z+"</span></li>").join("")}</ol><div class="ex">🌍 <b>Real-life example</b><br>${x[5]}</div><div class="ch">🎯 <b>Your challenge</b><br>${x[6]}</div><button class="btn o" data-a="say" data-i="${i}">🔊 Read this lesson aloud</button><button class="btn ${S.d.includes(i)?"ok":""}" data-a="done" data-i="${i}">${S.d.includes(i)?"✔ Done":"I did it! (+20 XP)"}</button></div></div>`}
function labs(){return '<h2>Practice labs</h2>'+LABS.map(l=>`<button class="item" data-a="lab" data-k="${l[0]}"><span>${l[1]}</span><div><b>${l[2]}</b><small>${l[3]}${FREE&&!["ty","pw"].includes(l[0])?" · 🔒":""}</small></div></button>`).join("")}
function labv(){const k=lab,b='<button class="back" data-a="labs">← All labs</button>';if(FREE&&!["ty","pw"].includes(k))return b+lockC;
 if(k=="ty"){if(!st.ty)st.ty={s:TY[Math.floor(Math.random()*3)],t0:0,r:null};const y=st.ty;return b+`<h2>⌨️ Typing test</h2><div class="tt" id="tt">${y.s}</div><textarea id="ti" rows="2" placeholder="Start typing here…" autocomplete="off" ${y.r?"disabled":""}></textarea>${y.r?`<div class="card"><h2>${y.r.w} WPM · ${y.r.a}% accurate</h2><p>${y.r.w<20?"Good start! Practise 10 minutes a day.":y.r.w<40?"Nice speed! Keep your eyes on the screen.":"Excellent typing!"}</p></div><button class="btn" data-a="tyr">Try another sentence</button>`:""}`}
 if(k=="pw")return b+`<h2>🔐 Password lab</h2><p>Type a <b>practice</b> password, not your real one. Nothing is saved.</p><input id="pi" placeholder="Try a password…" autocomplete="off"><div class="meter"><i id="pm" style="width:0"></i></div><div id="pt"></div>`;
 if(k=="xl"){const i=st.xl||0;if(i>=5)return b+'<h2>📊 Excel champion!</h2><div class="card">You wrote 5 real formulas. Try them in Excel now.</div>';return b+`<h2>📊 Excel challenge ${i+1}/5</h2><table><tr><th></th><th>A</th><th>B</th></tr><tr><td>1</td><td><b>Item</b></td><td><b>Price</b></td></tr><tr><td>2</td><td>Rice</td><td>80</td></tr><tr><td>3</td><td>Oil</td><td>120</td></tr><tr><td>4</td><td>Tea</td><td>45</td></tr><tr><td>5</td><td>Bread</td><td>15</td></tr></table><p><b>${XL[i][0]}</b></p><input id="xi" placeholder="Type a formula, for example =SUM(…)" autocomplete="off" autocapitalize="off"><button class="btn" data-a="xc">Check</button><div id="xm"></div>`}
 if(k=="ph"){const i=st.ph||0;if(i>=5)return b+'<h2>🎣 Sharp eyes!</h2><div class="card">You spotted all the messages. Always pause before you click.</div>';return b+`<h2>🎣 Scam or safe? ${i+1}/5</h2><div class="card">${PH[i][0]}</div><button class="opt" data-a="ph" data-v="1">🚨 Scam</button><button class="opt" data-a="ph" data-v="0">✅ Safe</button><div id="pm2"></div>`}
 const i=st.sq||0;if(i>=6)return b+'<h2>⚡ Shortcut star!</h2><div class="card">All 6 correct. Shortcuts save hours.</div>';const q=SQ[i];return b+`<h2>⚡ Shortcut quiz ${i+1}/6</h2><p><b>Which shortcut does this: ${q[0]}?</b></p>${q[1].map((o,j)=>`<button class="opt" data-a="sq" data-v="${j}">${o}</button>`).join("")}`}
function me(){const p=xp(),n=p<100?"Starter":p<250?"Learner":p<400?"Skilled":"Computer Pro",nx=p<100?100:p<250?250:p<400?400:510,B=SUB.map((s,i)=>[s[0],s[1]+" complete",L.filter((x,k)=>x[0]==i&&S.d.includes(k)).length==3]);B.push(["🧪","All labs done",S.l.length>=5]);
 return `<h2>My progress</h2><div class="card"><b style="font-size:1.4rem">${n}</b><p style="color:var(--mut);margin:4px 0 8px">${p} XP · next goal ${nx}</p><div class="meter"><i style="width:${Math.min(100,p/nx*100)}%;background:var(--ac)"></i></div></div><h3>Badges</h3><div class="card">${B.map(b=>`<div style="padding:6px 0;opacity:${b[2]?1:.35}"><span style="font-size:1.4rem">${b[0]}</span> ${b[1]}</div>`).join("")}</div><button class="btn o" data-a="wipe">Reset my progress</button>`}
function render(){$("#xp").textContent="⭐ "+xp()+" XP";$("#nav").innerHTML=[["home","🏠","Courses"],["labs","🧪","Labs"],["me","🏅","Progress"]].map(n=>`<button class="${tab==n[0]?"on":""}" data-t="${n[0]}"><i>${n[1]}</i>${n[2]}</button>`).join("");
 $("#app").innerHTML=tab=="home"?(sb===null?home():subj()):tab=="labs"?(lab?labv():labs()):me();scrollTo(0,0)}
function pwEval(v){const c=["password","123456","12345678","qwerty","abc123","iloveyou","111111"];let s=0,t=[];if(v.length>=12)s+=2;else if(v.length>=8)s++;else t.push("Use at least 12 characters.");if(/[a-z]/.test(v)&&/[A-Z]/.test(v))s++;else t.push("Mix capital and small letters.");if(/\d/.test(v))s++;else t.push("Add a number.");if(/[^A-Za-z0-9]/.test(v))s++;else t.push("Add a symbol like ! or #.");if(c.some(x=>v.toLowerCase().includes(x)))s=0,t=["This is a very common password. Avoid it."];return[s,t]}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 if(D.t){tab=D.t;sb=null;lab=null;st={};return render()}
 switch(D.a){case"sub":sb=+D.i;lv=0;render();break;case"home":sb=null;render();break;case"lv":lv=+D.i;render();break;
 case"done":{const i=+D.i;if(lk(L[i][1]))return;win("d",i,20);render();break}
 case"say":{const x=L[+D.i];if(!window.speechSynthesis)return toast("Reading aloud is not supported here");if(speechSynthesis.speaking){speechSynthesis.cancel();return}speechSynthesis.speak(new SpeechSynthesisUtterance(x[2]+". "+x[3]+" Steps. "+x[4].join(". ")+". Example. "+x[5]+" Challenge. "+x[6]));break}
 case"lab":lab=D.k;st={};render();break;case"labs":lab=null;st={};render();break;case"tyr":st.ty=null;render();break;
 case"xc":{const i=st.xl||0,v=$("#xi").value.replace(/\s+/g,"").replace(/[“”]/g,'"'),m=$("#xm");if(XL[i][1].test(v)){m.innerHTML=`<div class="opt good">✔ Correct! Excel shows <b>${XL[i][2]}</b></div><button class="btn" data-a="xn">Next</button>`}else m.innerHTML=`<div class="opt bad">Not yet. ${XL[i][3]}</div>`;break}
 case"xn":st.xl=(st.xl||0)+1;if(st.xl>=5)win("l","xl",30);render();break;
 case"ph":{const i=st.ph||0,ok=+D.v==PH[i][1];$("#pm2").innerHTML=`<div class="opt ${ok?"good":"bad"}">${ok?"✔ Right! ":"✘ Not quite. "}${PH[i][2]}</div><button class="btn" data-a="pn">Next</button>`;break}
 case"pn":st.ph=(st.ph||0)+1;if(st.ph>=5)win("l","ph",30);render();break;
 case"sq":{const i=st.sq||0;if(+D.v==SQ[i][2]){st.sq=i+1;if(st.sq>=6)win("l","sq",30);render()}else{t.classList.add("bad");toast("Try again")}break}
 case"wipe":if(confirm("Reset all progress?")){S={d:[],l:[]};sv("pc",JSON.stringify(S));render()}}});
document.addEventListener("input",e=>{const el=e.target;
 if(el.id=="ti"){const y=st.ty;if(!y.t0)y.t0=Date.now();const v=el.value;let h="",ok=0;for(let i=0;i<y.s.length;i++){const c=y.s[i],d=v[i];h+=d===undefined?`<span class="n">${c}</span>`:d===c?(ok++,`<span class="g">${c}</span>`):`<span class="r">${c}</span>`}$("#tt").innerHTML=h;if(v.length>=y.s.length){const m=(Date.now()-y.t0)/60000;y.r={w:Math.round(y.s.length/5/m),a:Math.round(ok/y.s.length*100)};win("l","ty",30);render()}}
 if(el.id=="pi"){const[s,t]=pwEval(el.value),n=["Very weak","Weak","Okay","Good","Strong","Excellent"][Math.min(s,5)],c=["#d64545","#d64545","#f5a524","#f5a524","#1e9e5a","#1e9e5a"][Math.min(s,5)];$("#pm").style.width=Math.min(s,5)/5*100+"%";$("#pm").style.background=c;$("#pt").innerHTML=`<b style="color:${c}">${el.value?n:""}</b><ul>${t.map(z=>"<li>"+z+"</li>").join("")}</ul>`;if(s>=5)win("l","pw",30)}});
$("#big").onclick=()=>{document.body.classList.toggle("big");sv("pcbig",document.body.classList.contains("big")?"1":"0")};
render();
